<h1>家庭应急手册</h1>
<p>遇到紧急情况时，<b>先保证人身安全</b>，再按下面的步骤处理。<i>请每年核对一次</i>，过期的<u>药品</u>要更换，<s>旧电话</s>已停用。</p>
<p style="text-align:center"><span style="color:#C00000">急救电话 120</span>，火警 119，报警 110。H<sub>2</sub>O，10<sup>3</sup>。</p>
<h2>一、紧急联系人</h2>
<table border="1">
<tr><th>称呼</th><th>电话</th><th>备注</th></tr>
<tr><td>爸爸</td><td>138 0000 0001</td><td rowspan="2">白天优先</td></tr>
<tr><td>妈妈</td><td>139 0000 0002</td></tr>
<tr><td colspan="2">物业服务中心</td><td>24 小时</td></tr>
</table>
<h2>二、停电时</h2>
<ol><li>查看是整栋楼停电还是只有家里。</li><li>家里跳闸时，先关掉大功率电器。<ol><li>空调</li><li>热水器</li></ol></li><li>再合上总闸。</li></ol>
<h2>三、应急包</h2>
<ul><li>手电筒和备用电池</li><li>饮用水 3 升</li><li>常用药品</li></ul>
<p>更多说明见 <a href="https://www.example.com/safety">安全指南</a>。</p>
