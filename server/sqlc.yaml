# Keep internal/store/queries and migrations ASCII-only: sqlc's SQLite engine
# miscalculates rewrite offsets when a query contains multi-byte characters.
version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlc
        out: internal/store/sqlc
        emit_json_tags: true
        emit_empty_slices: true
