  /api/v1/collections:
    get:
      operationId: listCollections
      x-kept-module: collections
      summary: 本空间的共享集（v1.0），带共享给了哪些空间
      tags: [collections]
      responses:
        "200":
          description: 共享集
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Collection" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCollection
      x-kept-module: collections
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 建一个共享集：选定的文档，或者一个筛选条件；可以同时共享给自己也是管理员的空间
      tags: [collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
                documentIds: { type: array, items: { type: integer, format: int64 }, maxItems: 1000 }
                filter: { type: object, additionalProperties: true, description: "与文档列表相同的筛选条件；给出时按条件共享" }
                workspaceIds: { type: array, items: { type: integer, format: int64 }, description: "共享给这些空间" }
      responses:
        "201":
          description: 已建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/collections/{id}:
    patch:
      operationId: updateCollection
      x-kept-module: collections
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 改名、增减文档（选定文档的共享集）或修改筛选条件
      tags: [collections]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 40 }
                addDocumentIds: { type: array, items: { type: integer, format: int64 } }
                removeDocumentIds: { type: array, items: { type: integer, format: int64 } }
                filter: { type: object, additionalProperties: true }
      responses:
        "200":
          description: 共享集
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCollection
      x-kept-module: collections
      x-kept-min-role: owner
      summary: 删除共享集（同时取消共享；文档不受影响）
      tags: [collections]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/collections/{id}/shares/{workspaceId}:
    put:
      operationId: shareCollection
      x-kept-module: collections
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 把共享集只读共享给另一个空间（你在那里也必须是管理员）
      tags: [collections]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: workspaceId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已共享 }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: unshareCollection
      x-kept-module: collections
      x-kept-min-role: owner
      summary: 取消对这个空间的共享
      tags: [collections]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: workspaceId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已取消 }
        default: { $ref: "#/components/responses/Error" }

