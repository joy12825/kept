              schema: { $ref: "#/components/schemas/JobStarted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: 当前空间最近的后台任务（设置 → 任务记录），从新到旧
      description: 还没成为文档的上传，只列给上传的人；没有上传的人的（上传链接、邮箱等），失败后列给空间管理员（v1.9.12）。
      tags: [system]
      parameters:
        - { name: status, in: query, description: "active 为排队中或进行中（v1.7.14）", schema: { type: string, enum: [queued, running, succeeded, failed, active] } }
        - { name: days, in: query, description: "最近几天，默认 30，最多 90", schema: { type: integer, minimum: 1, maximum: 90 } }
        - name: group
          in: query
          description: 按种类筛选（v1.7.14）：upload 上传，storage 存储（移动文档、导出到存储），organize 整理（重新处理、分类、抽屉、拆分合并、AI、工作流），other 其他
          schema: { $ref: "#/components/schemas/TaskGroup" }
        - { name: mine, in: query, description: "只看自己发起的（v1.7.14）", schema: { type: boolean } }
        - { name: people, in: query, description: "只列有人发起的任务，不含定时检查（v1.7.16，顶栏的任务面板用）", schema: { type: boolean } }
        - { name: limit, in: query, description: "最多返回几条，默认 500（v1.7.14）", schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: 任务
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

