      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: documentId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [original, preview, thumbnail] } }
      responses:
        "200":
          description: 文件内容（支持 Range 请求与 ETag）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/shared-drawers:
    get:
      operationId: listSharedDrawers
      summary: 其他空间共享给当前空间的抽屉（只读）
      tags: [drawers]
      responses:
        "200":
          description: 共享来的抽屉
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SharedDrawer" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/shared-drawers/{id}:
    get:
      operationId: getSharedDrawer
      summary: 共享来的抽屉
      tags: [drawers]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 抽屉
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedDrawer" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/shared-drawers/{id}/documents:
    get:
      operationId: listSharedDocuments
      summary: 共享来的抽屉里的文档，按文档日期从新到旧；q 为关键词
      tags: [drawers]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: 文档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedDocumentList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/shared-drawers/{id}/documents/{documentId}:
    get:
      operationId: getSharedDocument
      summary: 共享来的文档（只读）
      tags: [drawers]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: documentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 文档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedDocument" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/shared-drawers/{id}/documents/{documentId}/{kind}:
    get:
      operationId: getSharedDocumentFile
      summary: 共享来的文档的原件、预览（有可搜索版时为可搜索版）或缩略图
      tags: [drawers]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: documentId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [original, preview, thumbnail] } }
      responses:
        "200":
          description: 文件内容（支持 Range 请求与 ETag）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/share-links:
    get:
      operationId: listShareLinks
      x-kept-min-role: editor
      summary: 这份文档有效的分享链接（没有过期、没有作废），从新到旧
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 分享链接
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShareLink" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createShareLink
      x-kept-min-role: editor
      summary: 新建分享链接；没有可搜索版时 archive 改为 original。每份文档最多 20 个有效的链接
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, file]
              properties:
                days: { type: integer, minimum: 1, maximum: 365, description: "有效天数" }
                file: { type: string, enum: [archive, original] }
                watermark: { type: string, maxLength: 40, description: "水印文字（v1.9.2）：打开时每页 PDF 上都叠一层；空则不加。v1.11.2 起分享图片原件时画在图片上、仍给图片，其余给 PDF；没有 PDF 也不是图片的文档不能加" }
                allowDownload: { type: boolean, default: true, description: "允许下载（v1.9.2）；false 时只能在线查看" }
      responses:
        "201":
          description: 新的分享链接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions:
    get:
      operationId: listDocumentVersions
      summary: 文档的各个版本，从新到旧；从没上传过新版本的文档只有第 1 版（id 为 0）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 版本
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentVersion" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addDocumentVersion
      x-kept-min-role: editor
      summary: 上传新版本并设为当前版本；按新版本重新处理（返回任务）。加密的 PDF 返回 400 pdf_encrypted；与当前或历史版本、其他文档相同时返回 409
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              description: label 要放在 file 之前
              properties:
                label: { type: string, maxLength: 200, description: "版本说明，如“第二稿”" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: 已切换，正在重新处理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/from-document:
    post:
      operationId: addDocumentVersionFromDocument
      x-kept-min-role: editor
      summary: 把另一份文档并为这份的新版本（v1.5.8）：它的原件成为当前版本，标签、备注和这份没有的字段值并过来，链接到它的改为链接到这份，然后它不再单独存在。它自己有多个版本时返回 400；返回重新处理的任务
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: integer, format: int64 }
                label: { type: string, maxLength: 200, description: "版本说明；不填时为“取自《标题》”" }
      responses:
        "202":
          description: 已切换，正在重新处理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/decrypt:
    post:
      operationId: removeDocumentPassword
      x-kept-min-role: editor
      summary: 用密码解出加密的原件，作为没有密码的新版本（密码不保存）。密码不对时 400 wrong_password
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "202":
          description: 已生成新版本，正在重新处理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/{versionId}:
    delete:
      operationId: deleteDocumentVersion
      x-kept-min-role: editor
      summary: 删除不是当前的版本（连同文件）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/{versionId}/current:
    post:
      operationId: setCurrentDocumentVersion
      x-kept-min-role: editor
      summary: 把这个版本设为当前版本，按它重新处理（返回任务）。加密的版本不能设为当前版本
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202":
          description: 已切换，正在重新处理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/sheets:
    get:
      operationId: getDocumentSheets
      summary: 表格内容（v1.9.3）：Excel（xlsx）的各张表、CSV/TSV；每张最多 10000 行、200 列，超出时 truncated。值按文件里存的显示（公式取结果，日期格式显示成日期）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 表格
          content:
            application/json:
              schema:
                type: object
                required: [sheets]
                properties:
                  sheets:
                    type: array
                    items:
                      type: object
                      required: [name, rows, merges, truncated]
                      properties:
                        name: { type: string }
                        rows: { type: array, items: { type: array, items: { type: string } }, description: "按行；行尾的空单元格省略" }
                        merges: { type: array, items: { type: array, items: { type: integer }, minItems: 4, maxItems: 4 }, description: "合并的单元格：首行、首列、末行、末列（从 0 数）" }
                        truncated: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/word:
    get:
      operationId: getDocumentWord
      summary: Word 阅读视图（v1.9.8）：docx 读成块（段落、表格、文本框），按屏幕宽度排版用；不含 HTML。v1.11.1 起也支持 .doc 和 .odt；别的类型 400（not_word），设了打开密码的 400（word_encrypted），Word 95 及更早的 400（word_old）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 阅读视图的内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WordDocument" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/signatures:
    get:
      operationId: getDocumentSignatures
      x-kept-min-role: viewer
      summary: OFD 的电子签章（v1.11.3）：读原件现算，逐个验证被签的文件、原文摘要和 SM2 签名；证书的签发机构不核验。不是 OFD 时 400（not_ofd）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 签章
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OFDSignature" } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/signatures/{n}/seal:
    get:
      operationId: getDocumentSeal
      x-kept-min-role: viewer
      summary: 第 n 个签章（从 1 数）的印章图片；只给 PNG、JPEG，矢量印章没有图片（看可搜索版）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/word/images/{n}:
    get:
      operationId: getDocumentWordImage
      summary: 阅读视图里的第 n 张图片（从 1 数，对应 WordRun.image）；只给浏览器能显示的 PNG、JPEG、GIF、WebP、BMP
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: 图片
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/entries:
    get:
      operationId: listZipEntries
      summary: 压缩包里的文件（v1.9.3）：路径已清理（没有 .. 和开头的 /），最多 5000 个，超出时 truncated
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 文件
          content:
            application/json:
              schema:
                type: object
                required: [entries, truncated]
                properties:
                  truncated: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [path, size, dir, encrypted]
                      properties:
                        path: { type: string }
                        size: { type: integer, format: int64, description: "解压后的大小" }
                        dir: { type: boolean }
                        encrypted: { type: boolean, description: "有密码，不能导入" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/entries/import:
    post:
      operationId: importZipEntries
      x-kept-min-role: editor
      summary: 把压缩包里选中的文件导入为新文档（v1.9.3），进待整理；一次 1 到 200 个。不能导入的（重复、不支持的格式、太大、有密码）在结果里说明原因
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
      responses:
        "200":
          description: 各个文件的结果
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [path]
                      properties:
                        path: { type: string }
                        jobId: { type: integer, format: int64, description: "导入的任务；没有导入时省略" }
                        reason: { type: string, description: "没有导入的原因" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/{versionId}/text:
    get:
      operationId: getDocumentVersionText
      summary: 某个版本的文字（v1.9.2 版本对比）：当前版本是文档的文字；其他版本从文件里读（PDF 的文字层、文本、Office、邮件），扫描件和照片没有
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 文字
          content:
            application/json:
              schema:
                type: object
                required: [text, source]
                properties:
                  text: { type: string }
                  source: { type: string, enum: [content, file, none], description: "content：文档的文字（含识别结果）；file：从这个版本的文件里读出；none：读不出文字" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/{versionId}/preview:
    get:
      operationId: getDocumentVersionPreview
      summary: 某个版本显示用的 PDF（v1.9.7 并排看）：PDF 是原件；当前版本是可搜索版；旧版本的 Office、邮件、OFD 现转并缓存。转不了时 409（no_converter：没配转换服务；no_preview：这种文件不转 PDF）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: PDF（支持 Range 请求与 ETag）
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/versions/{versionId}/file:
    get:
      operationId: getDocumentVersionFile
      summary: 下载某个版本的文件（versionId 为 0 时是隐含的第 1 版，即当前原件）
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: inline, in: query, description: "true：在页面里显示，不作为附件（v1.9.2 版本对比）", schema: { type: boolean } }
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/duplicates:
    get:
      operationId: listDuplicates
      summary: 疑似重复的文档对（最多 100 对，最相似的在前），以及最近一次检查
      tags: [documents]
      parameters:
        - { name: document, in: query, description: "只要含这份文档的（v1.3.7，详情页的提示）", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 疑似重复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateList" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/duplicates/scan:
    post:
      operationId: scanDuplicates
      x-kept-min-role: editor
      summary: 立即检查当前空间的近似重复（后台任务 dedupe.scan）
      tags: [documents]
      responses:
        "202":
          description: 已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/duplicates/{id}/keep:
    post:
      operationId: keepDuplicate
      x-kept-min-role: editor
      summary: 保留这一对中的一份：另一份的标签加到保留的那份，另一份移到回收站
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: integer, format: int64, description: "要保留的文档" }
      responses:
        "204": { description: 已处理 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/duplicates/{id}/dismiss:
    post:
      operationId: dismissDuplicate
      x-kept-min-role: editor
      summary: 不是重复：以后不再提示这一对
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已处理 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/share-links:
    get:
      operationId: listActiveShares
      x-kept-min-role: editor
      summary: 这个空间所有还有效的分享（单份文档的链接和分享包，v1.4.2），从新到旧；集中查看、作废
      tags: [documents]
      responses:
        "200":
          description: 有效的分享
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveShare" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/share-bundles:
    post:
      operationId: createShareBundle
      x-kept-module: sharing
      x-kept-edition: pro
      x-kept-min-role: editor
      summary: 把多份文档打成一个分享包（v1.4.2）：一个链接，对方可以逐份预览、下载，或全部打包下载。每个空间最多 100 个有效的分享包
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, days, file]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: 文档，按这个顺序列出
                  items: { type: integer, format: int64 }
                title: { type: string, maxLength: 100, description: "对方看到的名称；留空时用第一份的标题加份数" }
                days: { type: integer, minimum: 1, maximum: 365 }
                file: { type: string, enum: [archive, original], description: "archive：可搜索版，没有时用原件" }
                watermark: { type: string, maxLength: 40, description: "水印文字（v1.9.2）：打开时每页 PDF 上都叠一层；空则不加。v1.11.2 起分享图片原件时画在图片上、仍给图片，其余给 PDF；没有 PDF 也不是图片的文档不能加" }
                allowDownload: { type: boolean, default: true, description: "允许下载（v1.9.2）；false 时只能在线查看" }
      responses:
        "201":
          description: 新的分享包
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveShare" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/share-bundles/{id}:
    delete:
      operationId: revokeShareBundle
      x-kept-min-role: editor
      summary: 作废分享包，立即生效
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已作废 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/checklists:
    get:
      operationId: listChecklists
      summary: 当前空间的办事材料清单（v1.6.2），按名称排序
      tags: [checklists]
      responses:
        "200":
          description: 清单
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Checklist" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChecklist
      x-kept-min-role: editor
      summary: 新建清单；每一项的条件要在本空间能用（标签、类型等都存在）
      tags: [checklists]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistInput" }
      responses:
        "201":
          description: 新建的清单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/checklists/{id}:
    get:
      operationId: getChecklist
      summary: 一份清单
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 清单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateChecklist
      x-kept-min-role: editor
      summary: 修改清单（整份替换）
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistInput" }
      responses:
        "200":
          description: 修改后的清单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChecklist
      x-kept-min-role: editor
      summary: 删除清单（文档不受影响）
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/checklists/{id}/check:
    get:
      operationId: checkChecklist
      summary: 核对清单：每一项找出最新的几份文档，标出齐了、缺几份、没有，以及已过期（内置到期日早于今天）的
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 核对结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistCheck" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/checklists/{id}/items/{itemId}/documents:
    post:
      operationId: attachChecklistDocument
      summary: 把已有的文档放进清单的这一项（v1.6.7）；手动放入的优先算数，不看条件
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: itemId, in: path, required: true, schema: { type: string, maxLength: 16 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documentId]
              properties:
                documentId: { type: integer, format: int64 }
      responses:
        "204": { description: 已放入 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/checklists/{id}/items/{itemId}/documents/{documentId}:
    delete:
      operationId: detachChecklistDocument
      summary: 把手动放入的文档移出这一项；文档本身不受影响
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: itemId, in: path, required: true, schema: { type: string, maxLength: 16 } }
        - { name: documentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 已移出 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/checklists/{id}/items/{itemId}/upload:
    post:
      operationId: uploadToChecklistItem
      summary: 上传文件到清单的这一项（v1.6.7）：照常入库（进待整理），同时放进这一项；可以预设标题（v1.6.8，放在 file 之前）
      description: 同一个文件已经在空间里时不再上传，直接把已有的那份放进这一项，返回 200 和它的 documentId。
      tags: [checklists]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: itemId, in: path, required: true, schema: { type: string, maxLength: 16 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                title: { type: string, maxLength: 200, description: "预设标题，如这一项的名称；不填时用文件名" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: 已收到，后台处理
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: integer, format: int64 }
        "200":
          description: 文件已经在空间里，已把那份放进这一项
          content:
            application/json:
              schema:
                type: object
                required: [documentId]
                properties:
                  documentId: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/upload-links:
    get:
      operationId: listUploadLinks
      x-kept-module: uploadLinks
      x-kept-min-role: editor
      summary: 当前空间的上传链接（v1.6.2），新的在前；失效 30 天以上的不列出
      tags: [upload-links]
      responses:
        "200":
          description: 上传链接
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UploadLink" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUploadLink
      x-kept-module: uploadLinks
      x-kept-edition: pro
      x-kept-min-role: editor
      summary: 生成上传链接：没有账号的人打开链接就能上传文件，进入待整理并带上预设的标签和抽屉；每个空间最多 20 个有效链接
      tags: [upload-links]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadLinkInput" }
      responses:
        "201":
          description: 新的上传链接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadLink" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/upload-links/{id}:
    delete:
      operationId: revokeUploadLink
      x-kept-module: uploadLinks
      x-kept-min-role: editor
      summary: 作废上传链接，立即生效；已经收到的文件不受影响
      tags: [upload-links]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已作废 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/public/uploads/{token}:
    get:
      operationId: getPublicUploadLink
      x-kept-module: uploadLinks
      summary: 上传链接的说明（无需登录）。过期、作废或收满时返回 404 link_closed
      tags: [public]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 上传链接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicUploadLink" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadThroughLink
      x-kept-module: uploadLinks
      summary: 通过上传链接上传一个文件（无需登录）。进入待整理；格式不支持、重复、太大时返回 400 / 409，链接失效时 404 link_closed
      tags: [public]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202": { description: 已收到，正在后台处理 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/public/bundles/{token}:
    get:
      operationId: getPublicBundle
      summary: 分享包里的文档（无需登录）。过期、作废或文档都已删除时返回 404 share_expired
      tags: [public]
      security: []
      parameters:
