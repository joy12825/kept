openapi: 3.0.3
info:
  title: Kept API
  version: 1.1.0
  description: |
    收好（Kept）服务端接口。后端（oapi-codegen）、网页端（openapi-typescript）
    和移动端都以本文件为唯一的接口定义。

    **认证**：网页端使用 Cookie 会话（`kept_session`），脚本和 App 使用
    `Authorization: Bearer kept_…` 形式的 API Token。

    **CSRF**：使用 Cookie 会话时，所有修改类请求（POST、PUT、PATCH、DELETE）
    必须带上 `X-CSRF-Token` 请求头，值为登录或 `GET /api/v1/me` 返回的 `csrfToken`。
    使用 Bearer Token 时不需要。

    **空间**：每个账号有一个个人空间，还可以加入家庭或团队空间。请求头 `X-Workspace-ID`
    指定本次请求在哪个空间里进行；不带时使用个人空间。GET 请求也可以用查询参数 `workspace`
    代替（事件流、图片和下载链接无法设置请求头）。不是该空间的成员、空间不存在或已删除时，
    一律返回 404，`code` 为 `workspace_not_found`（退出登录和无需登录的接口不受影响）。

    **角色**：`x-kept-min-role` 标注一个操作要求调用者在当前空间至少是什么角色
    （`viewer` 只看 < `editor` 成员 < `owner` 管理员），不够时返回 403。没有标注时，
    GET 默认为 `viewer`，其余默认为 `editor`。`none` 表示与当前空间的角色无关：
    操作针对账号本身，或由路径里的空间 ID 自行校验。

    **版本**（v1.12）：`x-kept-edition` 标注一个操作需要的版本（`pro` 收费版、`team` 企业版），
    当前版本不够时返回 403，`code` 为 `edition_required`，`details.edition` 写明需要的版本。
    只标新建、配置、运行和 AI 调用；读取、删除、撤销、关闭这类操作不标，版本到期后照常可用。
    成员和共享空间到了上限时，加人、建空间返回 403，`code` 为 `edition_limit`。
    `x-kept-module`（v1.13）标注一个操作属于哪个收费模块：开源的免费版构建里没有这些模块，
    调用时同样返回 403 `edition_required`。

    **错误**：所有错误都返回 `Error` 结构，`message` 为面向用户的中文说明。
servers:
  - url: /

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: system
  - name: health
  - name: auth
  - name: me
  - name: workspaces
  - name: audit
  - name: taxonomy
  - name: books
  - name: qa
  - name: documents
  - name: classifier
  - name: drawers
  - name: collections
  - name: devices
  - name: mail
  - name: admin

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: 健康检查
      tags: [system]
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: 依赖的组件不可用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/system/version:
    get:
      operationId: getVersion
      summary: 服务端版本信息
      tags: [system]
      security: []
      responses:
        "200":
          description: 版本信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /api/v1/auth/sso/start:
    get:
      operationId: startSSO
      x-kept-module: sso
      summary: 单点登录：转到身份服务（v1.0）。没有配置或身份服务连不上时转到 /?sso=原因（登录页显示原因）
      tags: [auth]
      security: []
      parameters:
        - { name: remember, in: query, description: "30 天内记住我", schema: { type: boolean } }
        - { name: next, in: query, description: "登录后去的站内路径", schema: { type: string } }
      responses:
        "302":
          description: 转到身份服务（同时写入只用于这一步的 Cookie）
          headers:
            Location: { schema: { type: string } }

  /api/v1/auth/sso/callback:
    get:
      operationId: ssoCallback
      x-kept-module: sso
      summary: 单点登录：身份服务转回来的地址。成功时写会话 Cookie 并转到 next，失败时转到 /?sso=原因（no_account、disabled、unverified、taken、unavailable、failed）
      tags: [auth]
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, description: "身份服务给出的错误（例如用户取消）", schema: { type: string } }
      responses:
        "302":
          description: 转到 next 或登录页
          headers:
            Location: { schema: { type: string } }

  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: 是否需要初始化
      tags: [auth]
      security: []
      responses:
        "200":
          description: 初始化状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      operationId: completeSetup
      summary: 创建第一个管理员账号并登录（仅在没有任何账号时可用）
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAccountRequest" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 用用户名和密码登录
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        "202":
          description: 密码正确，需要两步验证
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorChallenge" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/login/2fa:
    post:
      operationId: loginTwoFactor
      summary: 用两步验证挑战完成登录（验证码或恢复码）
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginTwoFactorRequest" }
      responses:
        "200": { $ref: "#/components/responses/LoggedIn" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      x-kept-min-role: none
      summary: 退出登录（结束当前会话）
      tags: [auth]
      responses:
        "204":
          description: 已退出
          headers:
            Set-Cookie:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify:
    post:
      operationId: verifySession
      x-kept-min-role: none
      summary: 确认密码或两步验证码，15 分钟内可以打开敏感文档（v1.6.4）
      description: 网页登录的会话和全功能的手机可以确认（手机从 v1.7.20 起，各自 15 分钟），API Token 不行；网页登录本身也算确认。错误次数过多时按账号限制（429）。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { type: string, maxLength: 256 }
                code: { type: string, maxLength: 16, description: "两步验证码（开启了两步验证时可以代替密码）" }
      responses:
        "200":
          description: 已确认
          content:
            application/json:
              schema:
                type: object
                required: [verifiedUntil]
                properties:
                  verifiedUntil: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      operationId: getMe
      x-kept-min-role: none
      summary: 当前用户、所在空间和 CSRF Token
      tags: [me]
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      x-kept-min-role: none
      summary: 修改显示名称和邮箱
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: 修改后的当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/locale:
    put:
      operationId: setMyLocale
      x-kept-min-role: none
      summary: 设置网页的界面语言（v1.10.0）：zh、en，空为跟随浏览器
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/password:
    post:
      operationId: changePassword
      x-kept-min-role: none
      summary: 修改自己的密码（其他设备上的会话会被结束）
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: 已修改 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/tokens:
    get:
      operationId: listTokens
      x-kept-min-role: none
      summary: 我的 API Token
      tags: [me]
      responses:
        "200":
          description: Token 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      x-kept-min-role: none
      summary: 新建 API Token（明文只返回这一次）
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: 新建的 Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiToken" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/me/tokens/{id}:
    delete:
      operationId: revokeToken
      x-kept-min-role: none
      summary: 吊销 API Token
      tags: [me]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已吊销 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/workflows:
    get:
      operationId: listWorkflows
      x-kept-module: workflows
      x-kept-min-role: owner
      summary: 当前空间的工作流，按执行顺序（空间管理员）
      tags: [workflows]
      responses:
        "200":
          description: 工作流
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workflow" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkflow
      x-kept-module: workflows
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 新建工作流（排在最后）
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowInput" }
      responses:
        "201":
          description: 新的工作流
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/workflows/reorder:
    post:
      operationId: reorderWorkflows
      x-kept-module: workflows
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 调整执行顺序（给出全部工作流的 ID）
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer, format: int64 } }
      responses:
        "204": { description: 已调整 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/workflows/{id}:
    put:
      operationId: updateWorkflow
      x-kept-module: workflows
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 修改工作流（完整的设置）
      tags: [workflows]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowInput" }
      responses:
        "200":
          description: 工作流
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWorkflow
      x-kept-module: workflows
      x-kept-min-role: owner
      summary: 删除工作流（连同运行记录）
      tags: [workflows]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/workflows/{id}/runs:
    get:
      operationId: listWorkflowRuns
      x-kept-module: workflows
      x-kept-min-role: owner
      summary: 工作流最近的运行记录，从新到旧
      tags: [workflows]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, description: "默认 50，最多 200", schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: 运行记录
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowRun" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mail-accounts:
    get:
      operationId: listMailAccounts
      x-kept-module: mail
      x-kept-min-role: owner
      summary: 当前空间的收件邮箱（空间管理员）；密码不返回
      tags: [mail]
      responses:
        "200":
          description: 收件邮箱
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMailAccount
      x-kept-module: mail
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 添加收件邮箱
      tags: [mail]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailAccountInput" }
      responses:
        "201":
          description: 新的收件邮箱
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mail-accounts/{id}:
    patch:
      operationId: updateMailAccount
      x-kept-module: mail
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 修改收件邮箱（完整的设置；密码留空表示不变）
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailAccountInput" }
      responses:
        "200":
          description: 修改后的收件邮箱
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMailAccount
      x-kept-module: mail
      x-kept-min-role: owner
      summary: 删除收件邮箱（已经收到的文档不受影响）
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mail-accounts/{id}/test:
    post:
      operationId: testMailAccount
      x-kept-module: mail
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 测试连接：登录并列出文件夹；失败时 400 并说明原因
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 邮箱里的文件夹
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mail-accounts/{id}/fetch:
    post:
      operationId: fetchMailAccount
      x-kept-module: mail
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 立即收取这个邮箱（后台任务）
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "202":
          description: 已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mail-accounts/{id}/messages:
    get:
      operationId: listMailMessages
      x-kept-module: mail
      x-kept-min-role: owner
      summary: 这个邮箱最近处理过的 100 封邮件，新的在前（v1.5.7）
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: 邮件
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MailMessage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mail-accounts/{id}/messages/{uidValidity}/{uid}/refetch:
    post:
      operationId: refetchMailMessage
      x-kept-module: mail
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 重新收取一封邮件：忘掉它并立即收取这个邮箱，按现在的规则再看一次（v1.5.7）。已经收过的附件会作为重复跳过；移到别的文件夹的邮件不能重新收取（409）
      tags: [mail]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: uidValidity, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: uid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "202":
          description: 已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/devices:
    get:
      operationId: listDevices
      x-kept-min-role: none
      summary: 我连接的手机（设置 → 已连接的设备），新配对的在前
      tags: [devices]
      responses:
        "200":
          description: 设备
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/devices/{id}:
    delete:
      operationId: revokeDevice
      x-kept-min-role: none
      summary: 断开一台手机，它的设备 token 立即失效
      tags: [devices]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已断开 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/devices/current:
    delete:
      operationId: forgetCurrentDevice
      x-kept-min-role: none
      summary: 手机自己断开连接（只能用设备 token 调用）
      tags: [devices]
      responses:
        "204": { description: 已断开 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/devices/pairing-codes:
    post:
      operationId: createPairingCode
      x-kept-min-role: none
      summary: 生成一个配对码（10 分钟有效、只能用一次），手机用它连接当前空间；之前未使用的配对码作废。只看的成员不能生成（403）
      tags: [devices]
      responses:
        "201":
          description: 配对码与二维码内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingCode" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/devices/pair:
    post:
      operationId: pairDevice
      security: []
      summary: 手机用配对码换取设备 token（明文只返回这一次）。配对码错误时 400；同一地址错误次数过多时 429。access 为 full 时手机按账号在空间里的角色访问（App 2.0），不能调用账号安全、配对、空间与成员管理和实例管理的接口；缺省 upload 只能上传
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "8 位数字，可以带空格" }
                deviceName: { type: string, maxLength: 64, description: "例如“小王的 iPhone”" }
                access: { $ref: "#/components/schemas/DeviceAccess" }
      responses:
        "200":
          description: 已连接
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairedDevice" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/mobile/bootstrap:
    get:
      operationId: getMobileBootstrap
      summary: 手机启动时需要的数据：空间、抽屉、标签、类型、上传上限
      tags: [devices]
      responses:
        "200":
          description: 启动数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileBootstrap" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads/same-name:
    post:
      operationId: checkSameName
      summary: 上传前检查同一抽屉里有没有同名文档（v1.7.13）
      description: 不带 drawerId 时检查不在抽屉里的文档。同名的有多份时取最新添加的一份。
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                drawerId: { type: integer, format: int64 }
                names:
                  type: array
                  maxItems: 500
                  items: { type: string }
      responses:
        "200":
          description: 同名的文档
          content:
            application/json:
              schema:
                type: object
                required: [auto, matches]
                properties:
                  auto: { type: boolean, description: "抽屉设为同名直接作为新版本，不用询问" }
                  matches:
                    type: array
                    items:
                      type: object
                      required: [name, documentId, title]
                      properties:
                        name: { type: string }
                        documentId: { type: integer, format: int64 }
                        title: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/storage/versions:
    put:
      operationId: setKeepVersions
      x-kept-min-role: owner
      summary: 每份文档最多保留几个旧版本（v1.7.13，空间管理员）；0 为全部保留
      description: 超出的最早的旧版本在文档下次有新版本时删除。
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/watch:
    put:
      operationId: adminSetWatch
      x-kept-min-role: none
      summary: 监听目录的设置（v1.7.13，仅实例管理员）
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versions]
              properties:
                versions: { type: boolean, description: "同一路径再次放入的文件作为那份文档的新版本" }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/uploads/status:
    post:
