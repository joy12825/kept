      x-kept-min-role: none
      summary: 设置每天备份的目录（v1.13.9，仅实例管理员，各版本都可用）；dir 为空表示停止。目录要已存在、可写，且不能和数据目录互相包含。部署时设置了 KEPT_BACKUP_DIR 时返回 409
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dir]
              properties:
                dir: { type: string, description: "服务器上的完整路径" }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: adminRunBackup
      x-kept-min-role: none
      summary: 立即备份到每天备份的目录（KEPT_BACKUP_DIR 或页面上设置的，仅实例管理员）。没有设置备份目录时返回 409；已有备份在排队或进行时返回那一次的任务
      tags: [admin]
      responses:
        "202":
          description: 已排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/backup-target:
