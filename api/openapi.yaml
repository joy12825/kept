        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: adminSetBackupTarget
      x-kept-module: storage
      x-kept-edition: pro
      x-kept-min-role: none
      summary: 设置备份目标（v1.7.6）；storage 为空表示不备份到存储。目标不能放着文档，也不能有空间在用
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage, keep]
              properties:
                storage: { type: string }
                keep: { type: integer, minimum: 1, maximum: 100, description: "保留的数据库快照份数" }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }

