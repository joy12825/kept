  /api/v1/qa/conversations/{id}/messages:
    post:
      operationId: askQuestion
      x-kept-module: ai
      x-kept-edition: pro
      x-kept-min-role: viewer
      summary: 提问。响应是 text/event-stream：sources（来源列表 JSON）、delta（回答的一段文字，JSON 字符串）、done（保存后的回答，QAMessage）、error（{message}）。断开连接即停止，已生成的部分保存为 stopped
      tags: [qa]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/{id}/ask:
    post:
      operationId: askDocument
      x-kept-module: ai
      x-kept-edition: pro
      x-kept-min-role: viewer
      summary: 问这份文档（v1.5.0）。只依据这份文档的文字回答，不保存对话；追问时把前几轮放在 history 里。响应是 text/event-stream：sources（给模型的段落，Source 列表）、delta（回答的一段文字）、done（DocAnswer）、error（{message}）。断开连接即停止
      tags: [qa]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1000 }
                history:
                  type: array
                  maxItems: 10
                  description: 前几轮的问答，只用最后 3 轮
                  items:
                    type: object
                    required: [question, answer]
                    properties:
                      question: { type: string, maxLength: 1000 }
                      answer: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

