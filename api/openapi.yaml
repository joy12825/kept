    post:
      operationId: retryJob
      x-kept-min-role: editor
      summary: 重新处理一个失败的上传（v1.9.12）：同一个任务回到排队，用保留的文件和上传时的预设
      description: |
        失败的上传保留文件 7 天（重复的不保留）。上传的人可以重试；上传链接、邮箱、监听目录、远程收件夹进来的，由空间管理员重试。
        不是失败的任务返回 409 not_failed；文件已经清理时返回 409 upload_expired，请重新上传。
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已重新排队 }
        default: { $ref: "#/components/responses/Error" }

