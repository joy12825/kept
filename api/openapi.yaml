  /api/v1/shared-collections/{id}/documents/{documentId}:
    get:
      operationId: getSharedCollectionDocument
      x-kept-module: collections
      summary: 共享集里的文档（只读）
      tags: [collections]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: documentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 文档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedDocument" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/shared-collections/{id}/documents/{documentId}/{kind}:
