      tags: [agents]
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: setAgentSettings
      x-kept-module: ai
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 修改 AI 设置（空间管理员）。模型在云端时开启须 cloudAcknowledged，否则 400 cloud_ack_required；没有配置模型时 400 ai_not_configured
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, intake, dailyLimit]
              properties:
                enabled: { type: boolean }
                intake: { type: boolean }
                steward: { type: boolean, description: "抽屉管家（v0.5）；不传保持原值" }
                narrative: { type: boolean, description: "年度回顾叙述（v0.5）；不传保持原值" }
                library: { type: boolean, description: "书房助手（v0.5）；不传保持原值" }
                auto: { $ref: "#/components/schemas/AgentAuto" }
                dailyLimit: { type: integer, minimum: 1, maximum: 100000 }
                cloudAcknowledged: { type: boolean }
                privateCloud: { type: boolean, description: "私密文档可以交给云端模型（v1.8.1）；不传保持原值" }
                vision: { type: boolean, description: "用看图模型读化验单（v1.9.0）；不传保持原值" }
      responses:
        "200":
          description: 设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        default: { $ref: "#/components/responses/Error" }

