  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: 当前空间的文档（不含回收站），可筛选、排序、分页
      description: |
        筛选条件见设计文档 11.9，例如待整理：`{"field":"inbox","op":"eq","value":true}`。
        文字条件 `{"text":"…"}` 由全文索引回答，支持查询语法（设计文档 5.4）；`"prefix": true` 时最后一个词按前缀匹配（边输边搜）。
        有文字条件时，列表项带命中片段 highlight。全文索引还没准备好时返回 503 search_unavailable。
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Filter" }
        - { $ref: "#/components/parameters/DocumentSort" }
        - { $ref: "#/components/parameters/SortDir" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: fields
          in: query
          description: 列表项带上这些自定义字段的值（fieldValues），逗号分隔的字段 ID，最多 20 个（v1.5.6，列表显示自定义字段列时用）
          schema: { type: string, pattern: '^[0-9]{1,18}(,[0-9]{1,18}){0,19}$' }
      responses:
        "200":
          description: 一页文档
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadDocument
      summary: 上传一个文件；文件在后台入库，返回任务 ID。同一空间里已有相同的文件时返回 409，details.documentId 为已有文档
      description: |
        带 clientUploadId 时上传是幂等的：同一空间里这个 ID 已经上传过、任务还在排队、处理中或已成功，就直接返回原来的任务（不再读取文件）；
        原来的任务失败了（v1.9.9），这个 ID 改归新的上传，重新处理。
        文档的来源按调用者记录：网页为 web，个人 API Token 为 api，手机（设备 token）为 mobile。
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              description: 预设字段要放在 file 之前（服务端边读边保存文件）
              properties:
                documentTypeId: { type: integer, format: int64 }
                correspondentId: { type: integer, format: int64 }
                personId: { type: integer, format: int64, description: "预设家人（v1.6.3）" }
                clientUploadId: { type: string, maxLength: 64, description: "客户端生成的唯一 ID（手机用 UUID），用于幂等和查询状态" }
                title: { type: string, maxLength: 200, description: "预设标题；不填时取文件名" }
                drawerId: { type: integer, format: int64, description: "预设抽屉，等同手动放入" }
                tagIds: { type: string, description: "预设标签 ID，逗号分隔" }
                createdDate: { type: string, format: date, description: "预设文档日期（v1.5.8），记为“上传时指定”，不再从正文识别" }
                asn: { type: integer, minimum: 1, maximum: 999999, description: "预设原件编号（v1.5.8）；已被其他文档使用时不填，并在任务里提示" }
                customFields: { type: string, description: "预设自定义字段（v1.5.8）：JSON 数组，如 [{\"fieldId\":3,\"value\":\"326.40\"}]，值的格式同修改文档；不正确的值记在日志里、不影响上传" }
                password: { type: string, description: "加密 PDF 的密码（只用于解密，不保存）。加密的 PDF 没有密码时返回 400 pdf_encrypted，密码不对时 400 wrong_password" }
                onConflict:
                  type: string
                  enum: [version, new]
                  description: >-
                    同一抽屉（没有 drawerId 时为不在抽屉里的文档）已有同名文档时（v1.7.13）：version 作为它的新版本，new 作为新文档。
                    不填时按抽屉的设置：抽屉设为“同名作为新版本”就作为新版本，否则作为新文档。作为新版本时返回的是重新处理的任务，versionOf 为那份文档
                file: { type: string, format: binary }
      responses:
        "202":
          description: 已接收，正在后台处理
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobAccepted" }
                  - type: object
                    properties:
                      versionOf: { type: integer, format: int64, description: "作为这份文档的新版本（v1.7.13）" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/facets:
    get:
      operationId: getDocumentFacets
      summary: 筛选按钮各选项的文档数，以及按月分组的份数
      description: 每组的计数都按“去掉本组条件后”的筛选结果计算；父标签的数量包含子标签上的文档（按文档去重）。没有类型或往来方的计入 key "none"。
      tags: [documents]
      parameters:
        - { $ref: "#/components/parameters/Filter" }
        - name: groups
          in: query
          required: true
          description: 逗号分隔：type、correspondent、person、location、tag、year、month、drawer（没有抽屉、家人、位置的计入 none）
          schema: { type: string }
      responses:
        "200":
          description: 各组的计数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Facets" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/bulk:
    post:
      operationId: bulkDocuments
      summary: 批量操作：修改、完成整理、删除到回收站、重新处理
      description: 按 ids 或 filter 选择（恰好一个），最多 10000 份；edit、delete、reprocess、classify 恰好一个。修改与删除在一个事务里完成；重新处理为每份文档各建一个任务，重新分类建一个任务。
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRequest" }
      responses:
        "200":
          description: 处理结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/move:
    post:
      operationId: moveDocuments
      summary: 把文档移到另一个空间（v1.3.8，如移到自己的个人空间）
      description: >-
        目标空间要求调用者是成员或管理员。文件、备注、版本、书目和调用者的阅读记录一起移过去；类型、往来方、标签、自定义字段在目标空间按名称对应，
        没有就新建；按目标空间的收纳规则重新放入抽屉。原空间的分享链接、共享集合、书单、提醒、疑似重复和 AI 建议不再包含它。
        原件编号在目标空间已被占用时清空。目标空间已有同一个文件，或文档正在处理时拒绝。一次最多 200 份，逐份移动，遇到失败即停止。
      tags: [documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, workspaceId]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: integer, format: int64 }
                workspaceId: { type: integer, format: int64, description: "目标空间" }
      responses:
        "200":
          description: 移动结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/next-asn:
    get:
      operationId: nextDocumentASN
      x-kept-min-role: editor
      summary: 下一个原件编号（v1.5.3）：空间里最大的编号加 1（含回收站，编号不重复使用）
      tags: [documents]
      responses:
        "200":
          description: 编号
          content:
            application/json:
              schema:
                type: object
                required: [asn]
                properties:
                  asn: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/documents/download:
    get:
      operationId: downloadDocuments
      summary: 把多份文档打包成 zip 下载（边打包边下载）
      description: 按 ids 或 filter 选择，最多 1000 份。kind=archive 时取可搜索版，没有可搜索版的取原件。
      tags: [documents]
      parameters:
        - name: ids
          in: query
          description: 逗号分隔的文档 ID
          schema: { type: string }
        - { $ref: "#/components/parameters/Filter" }
        - name: kind
          in: query
          schema: { type: string, enum: [original, archive], default: original }
      responses:
        "200":
          description: zip 文件
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/export:
    get:
      operationId: exportWorkspace
      x-kept-min-role: owner
      summary: 把当前空间导出为普通文件（v1.4.1，边打包边下载的 zip）
      description: >-
        按“抽屉/年份/日期 标题”放文件，附清单.csv（Excel 可打开）、清单.json 和说明.txt。不含回收站。
        file=searchable（默认）取可搜索版、没有时取原件；file=original 一律取原件。这不是备份，不能导回去。
      tags: [documents]
      parameters:
        - name: file
          in: query
          schema: { type: string, enum: [searchable, original], default: searchable }
      responses:
        "200":
          description: zip 文件
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

