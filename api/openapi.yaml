    post:
      operationId: revertProposal
      x-kept-module: ai
      x-kept-min-role: editor
      summary: 撤销智能体已经填入的内容；之后又被改过的值不动
      tags: [agents]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已撤销 }
        default: { $ref: "#/components/responses/Error" }

