      operationId: getEvents
      summary: 当前空间的实时事件（Server-Sent Events）。浏览器的 EventSource 不能设置请求头，可以用查询参数 workspace 代替 X-Workspace-ID
      description: |
        只推送调用者能知道的事件（v1.9.10）：带文档 ID 的，要看得到这份文档（私密文档只推给看得到的人）；
        还没有文档的上传任务，只推给发起上传的人。
      tags: [documents]
      parameters:
        - { name: workspace, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 事件流：每个事件的 event 为类型（job.updated、inbox.changed、document.updated），data 为 JSON；每 25 秒一行注释保活
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      x-kept-min-role: none
      summary: 所有账号（仅实例管理员）
      tags: [admin]
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateUser
      x-kept-min-role: none
      summary: 创建账号（仅实例管理员）
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateUserRequest" }
      responses:
        "201":
          description: 新账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/storage:
    get:
      operationId: getStorage
      summary: 当前空间的存储用量与配额（v1.0）
      tags: [workspaces]
      responses:
        "200":
          description: 用量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUsage" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/workspaces:
    get:
      operationId: adminListWorkspaces
      x-kept-min-role: none
      summary: 全部空间的用量与配额（仅实例管理员）
      tags: [admin]
      responses:
        "200":
          description: 空间
          content:
            application/json:
              schema:
                type: object
                required: [items, defaultQuota]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminWorkspace" } }
                  defaultQuota: { type: integer, format: int64, description: "KEPT_DEFAULT_QUOTA，0 为不限" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/workspaces/{id}/quota:
    put:
      operationId: adminSetWorkspaceQuota
      x-kept-module: quota
      x-kept-edition: team
      x-kept-min-role: none
      summary: 设置空间的配额（仅实例管理员）
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [default, unlimited, limit], description: "跟随默认、不限、具体大小" }
                bytes: { type: integer, format: int64, minimum: 1, description: "mode 为 limit 时的上限" }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/workspaces/{id}/storage:
    put:
      operationId: adminSetWorkspaceStorage
      x-kept-min-role: none
      summary: 设置空间的存储（v1.7.0，仅实例管理员）：新文档写到这里；move 为 true 时把已有文档也移过去（后台任务）
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage, move]
              properties:
                storage: { type: string, description: "存储的名字，local 为数据目录" }
                move: { type: boolean, description: "把已有文档也移过去" }
      responses:
        "200":
          description: 已设置
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: integer, format: int64, description: "移动文档的任务；没有要移的文档时没有" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storages:
    get:
      operationId: adminListStorages
      x-kept-min-role: none
      summary: 实例的存储（v1.7.0，仅实例管理员）：数据目录和 KEPT_STORAGES 配置的存储，以及文档还在用、但已不在配置里的存储
      tags: [admin]
      responses:
        "200":
          description: 存储
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminStorage" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateStorage
      x-kept-min-role: none
      summary: 添加存储（v1.7.2，仅实例管理员）；密钥加密后保存，之后不再返回
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageInput" }
      responses:
        "204": { description: 已添加，立即可用 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storages/{name}:
    put:
      operationId: adminUpdateStorage
      x-kept-min-role: none
      summary: 修改页面上添加的存储（v1.7.2）；secretKey 留空表示不变；已有文档时不能改类型、目录、桶和前缀
      tags: [admin]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageInput" }
      responses:
        "204": { description: 已修改 }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: adminDeleteStorage
      x-kept-min-role: none
      summary: 删除页面上添加的存储（v1.7.2）；还有文档或空间在用时不能删
      tags: [admin]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storage-test:
    post:
      operationId: adminTryStorage
      x-kept-min-role: none
      summary: 测试还没保存的存储设置（v1.7.2）；existing 为正在修改的存储，没填 secretKey 时用它保存的密钥
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage]
              properties:
                existing: { type: string }
                storage: { $ref: "#/components/schemas/StorageInput" }
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/storage/cold:
    put:
      operationId: setStorageCold
      x-kept-module: storage
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 设置当前空间的冷存储（v1.7.8，空间管理员）：超过若干个月的文档自动移过去
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage, months]
              properties:
                storage: { type: string, description: "冷存储；空为不用" }
                months: { type: integer, description: "文档日期早于这么多个月前的移过去（1–1200）" }
      responses:
        "200":
          description: 已设置
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: integer, format: int64, description: "移动文档的任务；没有要移的文档时没有" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/workspaces/{id}/cold:
    put:
      operationId: adminSetWorkspaceCold
      x-kept-module: storage
      x-kept-edition: pro
      x-kept-min-role: none
      summary: 设置空间的冷存储（v1.7.8，仅实例管理员）
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage, months]
              properties:
                storage: { type: string, description: "冷存储；空为不用" }
                months: { type: integer, description: "文档日期早于这么多个月前的移过去（1–1200）" }
      responses:
        "200":
          description: 已设置
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: integer, format: int64, description: "移动文档的任务；没有要移的文档时没有" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/members/uploads:
    get:
      operationId: listMemberUploads
      x-kept-min-role: owner
      summary: 各成员在当前空间上传了多少、上传额度（v1.7.11，空间管理员）
      tags: [workspaces]
      responses:
        "200":
          description: 成员
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, uploaded, quota]
                  properties:
                    userId: { type: integer, format: int64 }
                    uploaded: { type: integer, format: int64, description: "这个成员上传的文档和历史版本的大小" }
                    quota: { type: integer, format: int64, description: "上传额度，0 为不单独限制（只受空间配额限制）" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/members/{userId}/upload-quota:
    put:
      operationId: setMemberUploadQuota
      x-kept-module: quota
      x-kept-edition: team
      x-kept-min-role: owner
      summary: 设置成员在当前空间的上传额度（v1.7.11，空间管理员）；0 为不单独限制
      tags: [workspaces]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bytes]
              properties:
                bytes: { type: integer, format: int64, minimum: 0 }
      responses:
        "204": { description: 已设置 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/remote-inbox:
    get:
      operationId: getRemoteInbox
      x-kept-module: remoteInbox
      x-kept-min-role: owner
      summary: 当前空间的远程收件夹（v1.7.7，空间管理员）：存储里的一个文件夹，放进去的文件自动入库
      tags: [workspaces]
      responses:
        "200":
          description: 收件夹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteInbox" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setRemoteInbox
      x-kept-module: remoteInbox
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 设置远程收件夹；storage 为空表示不用（已入库的文档保留）
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage, folder, move, enabled]
              properties:
                storage: { type: string }
                folder: { type: string, description: "存储里的文件夹，例如 收件箱/王家" }
                move: { type: boolean, description: "入库后把文件移到这个文件夹的 _已入库/ 里" }
                enabled: { type: boolean }
      responses:
        "204": { description: 已保存 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/remote-inbox/scan:
    post:
      operationId: scanRemoteInbox
      x-kept-module: remoteInbox
      x-kept-edition: pro
      x-kept-min-role: owner
      summary: 立即扫描远程收件夹（新文件要两次扫描都没变才会入库）
      tags: [workspaces]
      responses:
        "200":
          description: 扫描后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteInbox" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/storage/location:
    get:
      operationId: getStorageLocation
      x-kept-min-role: owner
      summary: 当前空间的文档放在哪个存储，以及可以换到哪些存储（v1.7.2，空间管理员）
      tags: [workspaces]
      responses:
        "200":
          description: 存储
          content:
            application/json:
              schema:
                type: object
                required: [current, choices]
                properties:
                  current: { $ref: "#/components/schemas/WorkspaceStorage" }
                  choices: { type: array, items: { $ref: "#/components/schemas/StorageChoice" } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setStorageLocation
      x-kept-min-role: owner
      summary: 给当前空间换存储（v1.7.2，空间管理员）；move 为 true 时把已有文档也移过去
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage, move]
              properties:
                storage: { type: string }
                move: { type: boolean }
      responses:
        "200":
          description: 已设置
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storages/{name}/test:
    post:
      operationId: adminTestStorage
      x-kept-min-role: none
      summary: 测试存储能否读写（v1.7.0，仅实例管理员）：写入一个小文件、读回、删除
      tags: [admin]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storages/{name}/encryption:
    put:
      operationId: adminSetStorageEncryption
      x-kept-module: storage
      x-kept-edition: pro
      x-kept-min-role: none
      summary: 开关存储的加密（v1.11.0，仅实例管理员）；已有的文件在后台转换。第一次开启时生成恢复码，只在这次返回
      tags: [admin]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCode: { type: string, description: "新生成的恢复码；已有恢复码时省略" }
                  jobId: { type: integer, format: int64, description: "转换已有文件的任务" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storage-encryption:
    get:
      operationId: adminGetEncryption
      x-kept-min-role: none
      summary: 存储加密的恢复码和钥匙解不开的存储（v1.11.0，仅实例管理员）
      tags: [admin]
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncryptionStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storage-encryption/recovery-code:
    post:
      operationId: adminNewRecoveryCode
      x-kept-min-role: none
      summary: 重新生成存储加密的恢复码（v1.11.0）；旧的作废，新的只在这次返回
      tags: [admin]
      responses:
        "200":
          description: 新的恢复码
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCode]
                properties:
                  recoveryCode: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/storage-encryption/recover:
    post:
      operationId: adminRecoverEncryption
      x-kept-min-role: none
      summary: 用恢复码解开钥匙解不开的存储（v1.11.0），再用现在的主密钥保存
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: 解开了几个存储
          content:
            application/json:
              schema:
                type: object
                required: [recovered]
                properties:
                  recovered: { type: integer }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/users/{id}/sso:
    delete:
      operationId: adminUnlinkUserSSO
      x-kept-min-role: none
      summary: 解除账号的单点登录绑定（仅实例管理员）；下次单点登录时按邮箱重新绑定
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已解除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      x-kept-min-role: none
      summary: 停用、启用账号，授予或取消管理员（仅实例管理员）
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateUserRequest" }
      responses:
        "200":
          description: 修改后的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/users/{id}/password:
    post:
      operationId: adminSetPassword
      x-kept-min-role: none
      summary: 重置账号密码，并结束其所有会话（仅实例管理员）
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordRequest" }
      responses:
        "204": { description: 已重置 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/users/{id}/2fa:
    delete:
      operationId: adminDisableTwoFactor
      x-kept-min-role: none
      summary: 关闭某账号的两步验证（仅实例管理员，用于找回丢失设备的账号）
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: 已关闭 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/edition:
    get:
      operationId: getEdition
      x-kept-min-role: none
      summary: 当前版本（v1.12）：试用或许可证、到期、成员和共享空间的用量与上限、包含的功能；实例编号和许可证详情只给实例管理员
      tags: [system]
      responses:
        "200":
          description: 版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditionStatus" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/admin/license:
    put:
      operationId: adminInstallLicense
      x-kept-min-role: none
      summary: 导入许可证（v1.12）：校验签名和实例编号后保存，立即生效
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license]
              properties:
                license: { type: string, maxLength: 8192, description: "许可证文件的全部内容" }
      responses:
        "200":
          description: 导入后的版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditionStatus" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: adminRemoveLicense
      x-kept-min-role: none
      summary: 移除许可证（v1.12）：回到免费版（试用期内仍是试用）；数据都不受影响
      tags: [admin]
      responses:
        "200":
          description: 移除后的版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditionStatus" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kept_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      description: 每页条数，默认 50，最多 200
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: 上一页响应中的 nextCursor，原样传回
      schema: { type: string }
    Filter:
      name: filter
      in: query
      description: 筛选条件 JSON（设计文档 11.9）；不传表示全部
      schema: { type: string }
    DirectoryKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [correspondents, document-types, tags, persons] }
    DocumentSort:
      name: sort
      in: query
      description: created 文档日期（默认）、added 添加时间、modified 修改时间、title 标题（拼音）、correspondent 往来方（拼音）、amount 金额、due 到期日、asn 原件编号（这三种没有值的排在最后，v1.4.3）、relevance 关键词的相关度（从高到低，忽略 dir；没有关键词时同 created 从新到旧）、field:字段ID 按自定义字段（v1.5.6，文档链接字段除外，单选按选项的顺序，没有值的排在最后）
      schema: { type: string, pattern: '^(created|added|modified|title|correspondent|amount|due|asn|relevance|field:[0-9]{1,18})$', default: created }
    SortDir:
      name: dir
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    AuditAction:
      name: action
      in: query
      description: 按操作类型的前缀筛选，例如 `member.` 或 `member.add`
      schema: { type: string }
    AuditActorId:
      name: actorId
      in: query
      description: 只看某个账号的操作
      schema: { type: integer, format: int64 }
    AuditFrom:
      name: from
      in: query
      description: 起始时间（含）
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: 结束时间（不含）
      schema: { type: string, format: date-time }

  responses:
    LoggedIn:
      description: 已登录；响应头设置会话 Cookie
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    EditionStatus:
      type: object
      description: 当前版本（v1.12）
      required: [edition, trial, daysLeft, warn, expired, members, sharedWorkspaces, features]
      properties:
        edition: { type: string, enum: [free, pro, team] }
        trial: { type: boolean, description: "正在试用收费版" }
        trialEndsAt: { type: string, format: date-time, description: "试用结束（没有许可证或许可证已到期时给出，也包括已经结束的试用）" }
        daysLeft: { type: integer, description: "试用或许可证还剩几天；不会到期时为 -1" }
        warn: { type: boolean, description: "7 天内到期" }
        expired: { type: boolean, description: "装了许可证，但已经过了最后有效的一天" }
        license: { $ref: "#/components/schemas/LicenseInfo" }
        members: { $ref: "#/components/schemas/EditionUsage" }
        sharedWorkspaces: { $ref: "#/components/schemas/EditionUsage" }
        features:
          type: array
          description: 当前版本在免费版之外包含的功能
          items: { type: string, enum: [ai, privacy, scenes, storage, mail, uploadLinks, workflows, sharing, sso, quota, branding, postgres] }
        instance: { type: string, description: "实例编号，申请许可证时提供；只给实例管理员" }
        overridden: { type: boolean, description: "开发构建用 KEPT_EDITION 指定了版本" }
        openSource: { type: boolean, description: "开源构建（v1.13.1）：不含收费模块，始终是免费版，不试用、不能导入许可证" }

    LicenseInfo:
      type: object
      required: [id, edition, holder, issued]
      properties:
        id: { type: string }
        edition: { type: string, enum: [pro, team] }
        holder: { type: string }
        members: { type: integer, description: "许可证写明的成员上限；省略时用版本默认" }
        issued: { type: string, format: date }
        expires: { type: string, format: date, description: "最后有效的一天；省略为长期有效" }

    EditionUsage:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: integer, description: "0 为不限" }

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          description: 各组件的检查结果，值为 "ok" 或错误说明
          additionalProperties: { type: string }

    VersionInfo:
      type: object
      required: [version, commit, buildTime]
      properties:
        version: { type: string }
        commit: { type: string }
        buildTime: { type: string }

    StorageUsage:
      type: object
      required: [originals, searchable, thumbnails, versions, trash, total, documents, quota, quotaDefault, countedAt]
      properties:
        originals: { type: integer, format: int64 }
        searchable: { type: integer, format: int64, description: "可搜索版与页面编辑的底稿" }
        thumbnails: { type: integer, format: int64, description: "缩略图与封面" }
        versions: { type: integer, format: int64, description: "历史版本" }
        keepVersions: { type: integer, description: "每份文档最多保留的旧版本数，0 为全部保留（v1.7.13）" }
        trash: { type: integer, format: int64, description: "回收站里的文档（30 天后清除）" }
        total: { type: integer, format: int64 }
        documents: { type: integer, description: "不在回收站的文档数" }
        quota: { type: integer, format: int64, description: "配额，0 为不限" }
        quotaDefault: { type: boolean, description: "配额跟随实例的默认值" }
        countedAt: { type: string, format: date-time }

    AdminWorkspace:
      type: object
      required: [id, name, kind, color, members, owners, usage, storage]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        color: { type: string }
        members: { type: integer }
        owners: { type: string, description: "空间管理员的名字" }
        usage: { $ref: "#/components/schemas/StorageUsage" }
        storage: { $ref: "#/components/schemas/WorkspaceStorage" }

    WorkspaceStorage:
      type: object
      description: 空间的存储（v1.7.0）
      required: [name, pending, moving]
      properties:
        name: { type: string, description: "新文档写入的存储" }
        cold: { type: string, description: "冷存储（v1.7.8）；没有时省略" }
        coldAfterMonths: { type: integer, description: "文档日期早于这么多个月前的放冷存储" }
        pending: { type: integer, description: "不在该在的存储里的文档数（含回收站）" }
        moving: { type: boolean, description: "移动文档的任务在排队或进行中" }
        progress:
          type: object
          required: [total, moved, skipped, failed]
          properties:
            total: { type: integer }
            moved: { type: integer }
            skipped: { type: integer, description: "正在处理或刚改过，稍后再试" }
            failed: { type: integer }
        error: { type: string, description: "上一次移动的错误" }
        privateDocuments: { type: integer, description: "家人的私密文档数（v1.8.0，不含回收站）：拥有者看不到它们，只看到件数和占用" }
        privateBytes: { type: integer, format: int64, description: "私密文档占用的字节数" }
        last:
          type: object
          description: 上一次完成的移动（v1.7.14）；没有移动过时省略
          required: [jobId, finishedAt, total, moved, skipped, failed]
          properties:
            jobId: { type: integer, format: int64 }
            finishedAt: { type: string, format: date-time }
            total: { type: integer }
            moved: { type: integer }
            skipped: { type: integer }
            failed: { type: integer }

    BackupTarget:
      type: object
      required: [storage, keep, eligible]
      properties:
        storage: { type: string, description: "备份目标；空为不备份到存储" }
        keep: { type: integer }
        eligible: { type: array, items: { type: string }, description: "可以作为备份目标的存储" }
        dir: { type: string, description: "每天备份的目录：KEPT_BACKUP_DIR 或页面上设置的（v1.13.9）；没有时省略" }
        dirFromEnv: { type: boolean, description: "目录由部署配置 KEPT_BACKUP_DIR 决定，页面上不能改（v1.13.9）" }
        last: { $ref: "#/components/schemas/BackupRun" }
        versioning:
          type: object
          required: [supported, enabled]
          description: 备份目标的桶版本控制（v1.7.12，只有 S3 兼容存储）
          properties:
            supported: { type: boolean }
            enabled: { type: boolean }
            error: { type: string }

    ExportTarget:
      type: object
      required: [storage, folder, sensitive, choices, runs]
      properties:
        storage: { type: string }
        folder: { type: string }
        sensitive: { type: boolean }
        choices: { type: array, items: { type: string }, description: "可以导出到的存储" }
        dir: { type: string, description: "KEPT_EXPORT_DIR，部署时配置的导出目录；没有时省略" }
        runs: { type: array, items: { $ref: "#/components/schemas/ExportRun" } }

    ExportRun:
      type: object
      required: [workspaceId, workspace, status, at]
      properties:
        workspaceId: { type: integer, format: int64 }
        workspace: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        at: { type: string, format: date-time }
        folder: { type: string }
        written: { type: integer }
        unchanged: { type: integer }
        removed: { type: integer }
        skipped: { type: string }
        error: { type: string }

    BackupRun:
      type: object
      required: [status, at]
      description: 一次备份到存储
      properties:
        jobId: { type: integer, format: int64 }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        at: { type: string, format: date-time }
        snapshot: { type: string }
        documents: { type: integer }
        files: { type: integer }
        copied: { type: integer }
        bytes: { type: integer, format: int64 }
        missing: { type: integer }
        external: { type: integer, description: "读不到、没有备份的其他存储里的文件" }
        pruned: { type: integer }
        skipped: { type: string, description: "没有备份的原因（例如当时没有设置目标）" }
        error: { type: string }

    StorageTestResult:
      type: object
      required: [ok, tookMs]
      properties:
        ok: { type: boolean }
        tookMs: { type: integer, format: int64 }
        error: { type: string }

    StorageSettings:
      type: object
      description: 存储的设置（不含 Secret Key）
      properties:
        path: { type: string, description: "本机目录：绝对路径" }
        endpoint: { type: string, description: "S3：服务地址，主机:端口；没有证书的服务前面加 http://；留空为 AWS" }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        pathStyle: { type: boolean, description: "桶名放在路径里（MinIO 和多数 NAS）" }
        accessKey: { type: string }
        url: { type: string, description: "WebDAV：文件夹地址 http(s)://服务器/文件夹（v1.7.5）" }
        username: { type: string, description: "WebDAV：用户名" }

    StorageInput:
      type: object
      required: [kind, settings, selectable]
      properties:
        name: { type: string, description: "添加时必填；小写字母、数字和 -，以字母开头" }
        kind: { type: string, enum: [dir, s3, webdav] }
        description: { type: string, description: "说明，空间管理员选择时看到" }
        settings: { $ref: "#/components/schemas/StorageSettings" }
        secretKey: { type: string, description: "S3 的 Secret Key，或 WebDAV 的密码；修改时留空表示不变" }
        selectable: { type: boolean, description: "空间管理员可以给自己的空间选它" }
        capacity: { type: integer, format: int64, minimum: 0, description: "容量上限，字节；0 或省略为不限（v1.7.10）" }

    RemoteInbox:
      type: object
      required: [configured, storage, folder, move, enabled, counts, problems, choices]
      properties:
        configured: { type: boolean }
        storage: { type: string }
        folder: { type: string }
        move: { type: boolean }
        enabled: { type: boolean }
        scannedAt: { type: string, format: date-time }
        scanError: { type: string, description: "上一次扫描的错误" }
        counts:
          type: object
          description: 见过的文件，按状态：waiting 等它不再变化、queued 正在入库、imported 已入库、moved 已入库并移走、duplicate 已经有这份文件、changed 改过等它不再变化后作为新版本、quota 空间已满等待、failed 没能入库
          additionalProperties: { type: integer }
        problems:
          type: array
          items:
            type: object
            required: [key, state, error, at]
            properties:
              key: { type: string }
              state: { type: string }
              error: { type: string }
              at: { type: string, format: date-time }
        choices: { type: array, items: { $ref: "#/components/schemas/StorageChoice" }, description: "可以用作收件夹的存储" }

    StorageChoice:
      type: object
      required: [name, kind, description]
      properties:
        name: { type: string }
        kind: { type: string }
        description: { type: string }

    AdminStorage:
      type: object
      required: [name, kind, source, location, description, selectable, documents, workspaces, used, capacity]
      properties:
        name: { type: string }
        source: { type: string, enum: [local, env, page, missing], description: "local 数据目录；env 部署配置（只读）；page 页面上添加（v1.7.2）；missing 文档还在用、但已不在配置里" }
        description: { type: string }
        selectable: { type: boolean, description: "空间管理员可以选" }
        settings: { $ref: "#/components/schemas/StorageSettings" }
        error: { type: string, description: "页面上添加的存储没能启用的原因（例如主密钥变了）" }
        used: { type: integer, format: int64, description: "放在这里的文档和历史版本的大小（v1.7.10）" }
        capacity: { type: integer, format: int64, description: "容量上限，0 为不限" }
        kind: { type: string, enum: [local, dir, s3, webdav, other, missing], description: "local 数据目录；dir 本机的其他目录；s3 S3 兼容存储（v1.7.1）；webdav WebDAV（v1.7.5）；missing 文档还在用、但已不在配置里" }
        location: { type: string, description: "存放的位置（不含密钥）" }
        documents: { type: integer, description: "放在这里的文档（含回收站）" }
        workspaces: { type: array, items: { type: string }, description: "新文档写到这里的空间" }
        encryption: { $ref: "#/components/schemas/StorageEncryption" }

    StorageEncryption:
      type: object
      required: [enabled, locked, converting]
      description: 存储的加密（v1.11.0）；从没开过加密的存储省略
      properties:
        enabled: { type: boolean, description: "新文件加密后再存进去" }
        locked: { type: boolean, description: "钥匙解不开（主密钥变了），要输入恢复码" }
        converting: { type: boolean, description: "正在把已有的文件转成加密或明文" }
        progress:
          type: object
          required: [total, converted, skipped, failed]
          properties:
            total: { type: integer }
            converted: { type: integer }
            skipped: { type: integer }
            failed: { type: integer }
        error: { type: string, description: "上一次转换的错误" }

    EncryptionStatus:
      type: object
      required: [recovery, locked]
      properties:
        recovery: { type: boolean, description: "已经生成恢复码" }
        recoveryAt: { type: string, format: date-time }
        locked: { type: array, items: { type: string }, description: "钥匙解不开的存储" }

    SetupStatus:
      type: object
      required: [needsSetup]
      properties:
        needsSetup: { type: boolean }
        sso:
          type: object
          description: 配置了单点登录时（v1.0），登录页显示“使用 name 登录”
          required: [name, default]
          properties:
            name: { type: string }
            default: { type: boolean, description: "name 是没有设置 KEPT_OIDC_NAME 时的默认名称：登录页按界面语言显示“单点登录”（v1.10.1）" }

    NewAccountRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, description: "登录邮箱" }
        username: { type: string, description: "留空时根据邮箱自动生成" }
        password: { type: string, description: "8–256 个字符" }
        displayName: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: "用户名或邮箱" }
        password: { type: string }
        remember:
          type: boolean
          default: true
          description: "为 false 时使用浏览器会话 Cookie，关闭浏览器即失效；服务端闲置 12 小时过期"

    TwoFactorChallenge:
      type: object
      required: [challenge, expiresAt]
      properties:
        challenge: { type: string, description: 两步验证挑战令牌，提交给 loginTwoFactor }
        expiresAt: { type: string, format: date-time, description: 挑战过期时间 }

    LoginTwoFactorRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string }
        code: { type: string, description: 认证器 App 生成的 6 位验证码；与 recoveryCode 二选一 }
        recoveryCode: { type: string, description: 恢复码；与 code 二选一 }

    User:
      type: object
      required: [id, username, displayName, isAdmin, disabled, createdAt, twoFactorEnabled]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        isAdmin: { type: boolean }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        twoFactorEnabled: { type: boolean }
        sso: { type: boolean, description: "已绑定单点登录（v1.0）" }

    Workspace:
      type: object
      description: 一个空间，以及调用者在其中的角色
      required: [id, name, kind, color, role, memberCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          type: string
          enum: [personal, family, team]
        color: { $ref: "#/components/schemas/WorkspaceColor" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        memberCount: { type: integer, format: int64 }

    WorkspaceColor:
      type: string
      enum: [blue, cyan, green, orange, red, purple, pink, gray]

    WorkspaceRole:
      type: string
      description: owner 管理员，editor 成员，viewer 只看
      enum: [owner, editor, viewer]

    CreateWorkspaceRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, description: "1 到 32 个字符" }
        kind:
          type: string
          enum: [family, team]
        color: { $ref: "#/components/schemas/WorkspaceColor" }

    UpdateWorkspaceRequest:
      type: object
      properties:
        name: { type: string }
        color: { $ref: "#/components/schemas/WorkspaceColor" }

    DeleteWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "空间的名称，用来确认删除" }

    Member:
      type: object
      required: [userId, username, displayName, role, joinedAt]
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }

    AddMemberRequest:
      type: object
      required: [login, role]
      properties:
        login: { type: string, description: "用户名或邮箱；账号必须已经由管理员创建" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/WorkspaceRole" }

    AuditEvent:
      type: object
      required: [id, action, actorName, actorVia, targetType, targetId, summary, changes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, description: "“资源.动作”，例如 member.add" }
        actorId: { type: integer, format: int64, description: "操作者；后台任务和命令行执行的操作没有" }
        actorName: { type: string, description: "操作者当前的显示名称；账号已不存在时为空" }
        actorVia:
          type: string
          enum: [session, token, device, agent, system]
        targetType: { type: string }
        targetId: { type: string }
        summary: { type: string, description: "可以直接显示的中文描述" }
        changes:
          type: object
          description: 变化了的字段，值为 [修改前, 修改后]
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextCursor: { type: string, description: "还有更早的记录时返回；没有时省略" }

    MatchRule:
      type: object
      description: 新文档如何自动归入这一项（设计文档 5.6）
      required: [algorithm, match, caseInsensitive]
      properties:
        algorithm:
          type: string
          description: auto 自动学习，any 任意词，all 全部词，literal 精确匹配，regex 正则表达式，fuzzy 模糊匹配，none 不自动匹配
          enum: [auto, any, all, literal, regex, fuzzy, none]
        match: { type: string, description: "关键词、短语或正则表达式；auto 和 none 时为空" }
        caseInsensitive: { type: boolean }

    EmergencyContact:
      type: object
      required: [id, userId, username, displayName, drawerIds, waitHours, status, reason, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        drawerIds: { type: array, items: { type: integer, format: int64 } }
        waitHours: { type: integer, description: "等待期（小时，24 到 720）" }
        status: { type: string, enum: [idle, pending, granted], description: "idle 还没有申请；pending 已申请，到 grantAt 自动生效；granted 已生效" }
        reason: { type: string, description: "申请时的说明" }
        requestedAt: { type: string, format: date-time }
        grantAt: { type: string, format: date-time }
        grantedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    EmergencyContactInput:
      type: object
      additionalProperties: false
      required: [login, drawerIds, waitHours]
      properties:
        login: { type: string, minLength: 1, maxLength: 254, description: "用户名或邮箱" }
        drawerIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer, format: int64 } }
        waitHours: { type: integer, minimum: 24, maximum: 720 }
    EmergencyContactPatch:
      type: object
      additionalProperties: false
      required: [drawerIds, waitHours]
      properties:
        drawerIds: { type: array, minItems: 1, maxItems: 100, items: { type: integer, format: int64 } }
        waitHours: { type: integer, minimum: 24, maximum: 720 }
    EmergencyAccess:
      allOf:
        - { $ref: "#/components/schemas/EmergencyContact" }
        - type: object
          required: [workspaceId, workspaceName, owners, drawers]
          properties:
            workspaceId: { type: integer, format: int64 }
            workspaceName: { type: string }
            owners: { type: array, items: { type: string }, description: "空间管理员的名称" }
            drawers: { type: array, items: { type: string }, description: "生效后可以看的抽屉" }
    Metric:
      type: object
      description: 指标（v1.8.2）
      required: [id, name, aliases, category, specimen, unit, kind]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: "内置指标的代号；自己加的省略" }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        category: { type: string, description: "血常规、肝功能…" }
        specimen: { type: string, description: "blood、urine、stool、other，或空" }
        unit: { type: string, description: "标准单位；各次的值都换算成它" }
        refLow: { type: number, format: double, description: "默认参考范围（单子上没有时用）" }
        refHigh: { type: number, format: double }
        kind: { type: string, enum: [number, qualitative], description: "qualitative：阴性、+、++ 这类，值是等级（阴性 0、± 0.5、+ 1…）" }
        direction: { type: string, enum: ["", none], description: "none：只记录、不判断好坏（身高、读数、里程，v1.9.0）" }

    MetricInput:
      type: object
      properties:
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        category: { type: string }
        unit: { type: string }
        refLow: { type: number, format: double }
        refHigh: { type: number, format: double }

    HealthPoint:
      type: object
      required: [documentId, date, text, flag]
      properties:
        documentId: { type: integer, format: int64 }
        date: { type: string, format: date }
        value: { type: number, format: double, description: "换算到指标单位的值；定性结果是等级" }
        text: { type: string, description: "单子上的写法" }
        refLow: { type: number, format: double, description: "这张单子的参考范围，换算到指标单位" }
        refHigh: { type: number, format: double }
        flag: { type: string, enum: ["", high, low, abnormal] }
        observationId: { type: integer, format: int64 }
        manual: { type: boolean, description: "手动记的一笔（v1.9.0），documentId 为 0" }
        note: { type: string }
        service: { type: boolean, description: "这条里程是一次保养（v1.11.5）" }

    LabRow:
      type: object
      required: [id, rawName, text, unit, refText, flag, page, bbox, confidence, source]
      properties:
        id: { type: integer, format: int64 }
        metricId: { type: integer, format: int64, description: "对上的指标；没对上时省略" }
        rawName: { type: string, description: "单子上的名称" }
        value: { type: number, format: double }
        text: { type: string }
        unit: { type: string }
        std: { type: number, format: double, description: "换算到指标单位的值" }
        refLow: { type: number, format: double }
        refHigh: { type: number, format: double }
        refText: { type: string }
        flag: { type: string, enum: ["", high, low, abnormal] }
        page: { type: integer, description: "在第几页（从 1 开始）；不知道时为 0" }
        bbox: { type: string, description: "这一行在页面上的位置：x0,y0,x1,y1，页面宽高的比例；不知道时为空" }
        confidence: { type: number, format: double }
        source: { type: string, enum: [rule, ai, manual] }
        previous: { $ref: "#/components/schemas/HealthPoint" }

    Lab:
      type: object
      description: 一份文档识别出的检查结果（v1.8.2）
      required: [documentId, status, source, patient, specimen, sampledOn, reportedOn, department, date, extractedAt, canEdit, rows]
      properties:
        scene: { type: string, enum: [health, utility, car], description: "识别出的内容属于哪个场景（v1.11.5）：体检、水电读数、车辆里程" }
        sceneId: { type: integer, format: int64, description: "水电、车辆场景的 id" }
        documentId: { type: integer, format: int64 }
        status: { type: string, enum: [running, pending, confirmed, empty, failed], description: "识别中、待核对、已核对、没有找到指标、失败" }
        source: { type: string }
        error: { type: string }
        patient: { type: string, description: "单子上的姓名" }
        specimen: { type: string }
        sampledOn: { type: string }
        reportedOn: { type: string }
        department: { type: string }
        personId: { type: integer, format: int64 }
        date: { type: string, format: date, description: "测量日期（采样、报告或文档日期）" }
        visitId: { type: integer, format: int64 }
        extractedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        canEdit: { type: boolean }
        rows: { type: array, items: { $ref: "#/components/schemas/LabRow" } }
        conclusion: { type: string, description: "结论、检查提示、印象（v1.8.3）" }
        diagnosis: { type: string, description: "诊断" }
        advice: { type: string, description: "医嘱、建议" }
        recheckOn: { type: string, description: "建议复查的日期 YYYY-MM-DD，或空" }
        recheckNote: { type: string, description: "要求复查的那句话" }
        medications: { type: array, description: "开的药（v1.9.0）", items: { $ref: "#/components/schemas/Medication" } }

    LabInput:
      type: object
      required: [date, rows, confirm]
      properties:
        personId: { type: integer, format: int64 }
        date: { type: string, format: date }
        confirm: { type: boolean }
        rows:
          type: array
          items:
            type: object
            required: [rawName, text]
            properties:
              metricId: { type: integer, format: int64 }
              rawName: { type: string }
              text: { type: string, description: "结果：6.2、<0.5、阴性、++" }
              unit: { type: string }
              refLow: { type: number, format: double }
              refHigh: { type: number, format: double }
              refText: { type: string }
              flag: { type: string, enum: ["", high, low, abnormal] }
              page: { type: integer }
              bbox: { type: string }
              source: { type: string, enum: [rule, ai, manual] }
        conclusion: { type: string, maxLength: 2000 }
        diagnosis: { type: string, maxLength: 2000 }
        advice: { type: string, maxLength: 2000 }
        recheckOn: { type: string, description: "YYYY-MM-DD，或空" }
        recheckNote: { type: string, maxLength: 200 }
        medications: { type: array, maxItems: 50, description: "开的药；省略时保留识别出的（v1.9.0）", items: { $ref: "#/components/schemas/Med" } }

    HealthOverview:
      type: object
      required: [enabled, persons]
      properties:
        enabled: { type: boolean, description: "空间有指标字典（启用了模板或识别过单子）" }
        scene: { $ref: "#/components/schemas/Scene" }
        persons:
          type: array
          items:
            type: object
            required: [pending, metrics]
            properties:
              personId: { type: integer, format: int64, description: "没有指定家人的单子省略" }
              lastReport: { type: string, format: date }
              pending: { type: array, description: "待核对的单子，新的在前", items: { type: integer, format: int64 } }
              metrics:
                type: array
                items:
                  type: object
                  required: [metric, latest, series]
                  properties:
                    metric: { $ref: "#/components/schemas/Metric" }
                    latest: { $ref: "#/components/schemas/HealthPoint" }
                    previous: { $ref: "#/components/schemas/HealthPoint" }
                    series: { type: array, description: "最近十次，从早到晚", items: { $ref: "#/components/schemas/HealthPoint" } }

    HealthSeries:
      type: object
      required: [metric, points]
      properties:
        metric: { $ref: "#/components/schemas/Metric" }
        points: { type: array, items: { $ref: "#/components/schemas/HealthPoint" } }

    Visit:
      type: object
      required: [id, date, department, note, documentIds]
      properties:
        id: { type: integer, format: int64 }
        personId: { type: integer, format: int64 }
        date: { type: string, format: date }
        correspondentId: { type: integer, format: int64 }
        department: { type: string }
        note: { type: string }
        documentIds: { type: array, items: { type: integer, format: int64 } }
        documents: { type: array, description: "这次就诊的文档和金额（v1.8.3）", items: { $ref: "#/components/schemas/VisitDocument" } }
        others: { type: array, description: "同一位家人（或没有家人）同一天、还没归入就诊的文档", items: { $ref: "#/components/schemas/VisitDocument" } }

    Scene:
      type: object
      description: 场景（v1.9.0）
      required: [id, key, name, icon, byPerson, private, metricIds]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: "内置模板：health、growth、utility、car；自己建的为空" }
        name: { type: string }
        icon: { type: string }
        byPerson: { type: boolean }
        private: { type: boolean }
        metricIds: { type: array, items: { type: integer, format: int64 } }
        serviceKm: { type: integer, description: "车辆保养场景（v1.11.5）：每多少公里保养一次，0 不按里程提醒" }
        serviceMonths: { type: integer, description: "每多少个月保养一次，0 不按时间提醒" }

    SceneInput:
      type: object
      required: [name, byPerson, private]
      properties:
        name: { type: string, maxLength: 20 }
        icon: { type: string, maxLength: 20 }
        byPerson: { type: boolean }
        private: { type: boolean }
        metricIds: { type: array, maxItems: 200, items: { type: integer, format: int64 } }
        newMetrics:
          type: array
          maxItems: 50
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 40 }
              unit: { type: string, maxLength: 20 }
              category: { type: string, maxLength: 20 }
        serviceKm: { type: integer, minimum: 0, maximum: 100000, description: "车辆保养场景的保养间隔（v1.11.5）：公里，0 不按里程；不填不变" }
        serviceMonths: { type: integer, minimum: 0, maximum: 60, description: "月，0 不按时间；不填不变" }

    SceneList:
      type: object
      required: [scenes, templates]
      properties:
        scenes: { type: array, items: { $ref: "#/components/schemas/Scene" } }
        templates:
          type: array
          items:
            type: object
            required: [key, name, icon, description, byPerson, private, metrics]
            properties:
              key: { type: string }
              name: { type: string }
              icon: { type: string }
              description: { type: string }
              byPerson: { type: boolean }
              private: { type: boolean }
              metrics: { type: array, description: "指标名称（体检与化验只列前几个）", items: { type: string } }
              sceneId: { type: integer, format: int64, description: "已启用时的场景" }

    ObservationInput:
      type: object
      required: [metricId, date, text]
      properties:
        metricId: { type: integer, format: int64 }
        personId: { type: integer, format: int64 }
        date: { type: string, format: date }
        text: { type: string, maxLength: 40, description: "结果：120、5×4、阴性" }
        unit: { type: string, maxLength: 20, description: "省略时是指标的单位" }
        note: { type: string, maxLength: 200 }
        service: { type: boolean, description: "这条里程是一次保养（v1.11.5，只有里程可以）" }

    Med:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }
        spec: { type: string, maxLength: 60, description: "规格：20mg×7片" }
        dose: { type: string, maxLength: 40, description: "单次用量：20mg" }
        frequency: { type: string, maxLength: 40, description: "频次：每晚一次" }
        days: { type: integer, minimum: 0, maximum: 3650, description: "天数，0 表示没写" }

    Medication:
      type: object
      description: 一种药（v1.9.0）
      required: [id, name, spec, dose, frequency, days, startOn, endOn, status, note, source, active]
      properties:
        id: { type: integer, format: int64 }
        personId: { type: integer, format: int64 }
        documentId: { type: integer, format: int64, description: "开药的单子；手动添加的省略" }
        visitId: { type: integer, format: int64 }
        name: { type: string }
        spec: { type: string }
        dose: { type: string }
        frequency: { type: string }
        days: { type: integer }
        startOn: { type: string }
        endOn: { type: string, description: "最后一天；一直在用时为空" }
        status: { type: string, enum: [active, stopped] }
        note: { type: string }
        source: { type: string, enum: [rule, ai, manual] }
        active: { type: boolean, description: "在用：没停用，也没过天数" }

    MedicationInput:
      type: object
      required: [name]
      properties:
        personId: { type: integer, format: int64 }
        name: { type: string, maxLength: 60 }
        spec: { type: string, maxLength: 60 }
        dose: { type: string, maxLength: 40 }
        frequency: { type: string, maxLength: 40 }
        days: { type: integer, minimum: 0, maximum: 3650 }
        startOn: { type: string, format: date }
        note: { type: string, maxLength: 200 }

    VisitDocument:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        amount: { type: string, description: "金额，两位小数；没有时省略" }

    HealthAlert:
      type: object
      description: 健康提醒（v1.8.3）
      required: [id, kind, documentId, text, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [range, trend, change, recheck, service], description: "超出范围、连续变差、变化较大、该复查了、该保养了（v1.11.5）" }
        personId: { type: integer, format: int64 }
        metricId: { type: integer, format: int64 }
        documentId: { type: integer, format: int64 }
        dueDate: { type: string, description: "recheck：建议复查的日期；service：按时间该保养的日期" }
        daysLeft: { type: integer, description: "recheck：还有几天，已过为负数" }
        text: { type: string }
        createdAt: { type: string, format: date-time }

    HealthSettings:
      type: object
      required: [range, trendCount, changePct, recheckDays]
      properties:
        range: { type: boolean, description: "最近一次超出参考范围时提醒" }
        trendCount: { type: integer, minimum: 0, maximum: 10, description: "连续几次变差时提醒，0 不提醒" }
        changePct: { type: integer, minimum: 0, maximum: 1000, description: "和上次比变差超过这个百分比时提醒，0 不提醒" }
        recheckDays: { type: integer, minimum: 0, maximum: 90, description: "复查日期前几天开始提醒" }

    HealthReport:
      type: object
      description: 给医生看的汇总（v1.8.3）
      required: [personName, metrics, notes, documents]
      properties:
        personId: { type: integer, format: int64 }
        personName: { type: string }
        from: { type: string }
        to: { type: string }
        metrics:
          type: array
          items:
            type: object
            required: [metric, points]
            properties:
              metric: { $ref: "#/components/schemas/Metric" }
              points: { type: array, items: { $ref: "#/components/schemas/HealthPoint" } }
        notes:
          type: array
          items:
            type: object
            required: [documentId, date, title, conclusion, diagnosis, advice, recheckOn]
            properties:
              documentId: { type: integer, format: int64 }
              date: { type: string }
              title: { type: string }
              conclusion: { type: string }
              diagnosis: { type: string }
              advice: { type: string }
              recheckOn: { type: string }
        documents: { type: array, items: { $ref: "#/components/schemas/DocRef" } }
        medications: { type: array, description: "这段时间开过或在用的药（v1.9.0）", items: { $ref: "#/components/schemas/Medication" } }

    HealthReportShare:
      type: object
      required: [personId, days]
      properties:
        personId: { type: integer, format: int64 }
        metricIds: { type: array, maxItems: 200, items: { type: integer, format: int64 } }
        from: { type: string, format: date }
        to: { type: string, format: date }
        title: { type: string, maxLength: 100 }
        days: { type: integer, minimum: 1, maximum: 365 }

    Location:
      type: object
      required: [id, name, initial, note, documentCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        initial: { type: string, description: "目录分组：A-Z 或 #" }
        note: { type: string, description: "如：书房柜子第 2 层" }
        documentCount: { type: integer }
    LocationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        note: { type: string, maxLength: 200 }
    TaxonomyItem:
      type: object
      description: 往来方、文档类型或家人
      required: [id, name, initial, sortKey, rule]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        initial: { type: string, description: "目录分组：汉字开头为拼音首字母 A–Z，其余为 #" }
        sortKey: { type: string, description: "拼音排序键（如 guojiadianwang），也用于按拼音查找" }
        rule: { $ref: "#/components/schemas/MatchRule" }
        documentCount: { type: integer, description: "文档数（不含回收站）" }
        lastDocumentDate: { type: string, format: date, description: "最近一份文档的日期；没有文档时省略" }
        retentionMonths: { type: integer, description: "类型的保留期限（月，v1.6.5）；永久保留时省略。超过期限的文档出现在“可以清理”里（筛选条件 {\"field\":\"retention\",\"op\":\"expired\",\"value\":true}），不会自动删除" }
        privateByDefault: { type: boolean, description: "只用于类型（v1.8.0）：这类文档选了家人后自动成为这位家人的私密文档" }
        privacy: { $ref: "#/components/schemas/PersonPrivacy" }

    PersonPrivacy:
      type: object
      description: 家人的隐私设置，按当前成员看到的（v1.8.0）
      required: [personId, holder, claimable, privateCount, needsReview]
      properties:
        personId: { type: integer, format: int64 }
        self: { $ref: "#/components/schemas/PersonAccess" }
        myLevel: { type: string, enum: [self, guardian, manage, read], description: "我的权限；没有时省略" }
        holder: { type: boolean, description: "我管理谁能看（本人；没有本人时是照看人）" }
        claimable: { type: boolean, description: "还没有人负责，我可以关联本人账号或指定照看人" }
        privateCount: { type: integer, description: "私密文档数（含回收站）；只有本人、监护人和被授权的人看得到，其他人总是 0（v1.9.10）" }
        needsReview: { type: boolean, description: "我是本人，关联前就有照看人，要决定是否保留" }
        access:
          type: array
          description: 谁能看；只有有权限的人看得到，其他人省略
          items: { $ref: "#/components/schemas/PersonAccess" }
        emergency:
          type: array
          description: 紧急联系人；只有负责的人和联系人自己看得到
          items: { $ref: "#/components/schemas/PersonEmergency" }
        key: { $ref: "#/components/schemas/PersonKey" }
        cloudAi: { type: boolean, description: "本人同意私密文档交给云端 AI 模型（v1.8.1；空间也要开启）" }

    PersonKey:
      type: object
      description: 家人的钥匙（v1.8.1）；没有设时省略
      required: [createdAt, recoveryAt, myPassword]
      properties:
        createdAt: { type: string, format: date-time }
        recoveryAt: { type: string, format: date-time, description: "现在的恢复码是什么时候生成的" }
        myPassword: { type: boolean, description: "我的登录密码也能打开它" }

    RecoveryCode:
      type: object
      required: [recoveryCode]
      properties:
        recoveryCode: { type: string, description: "25 位，分 5 组，例如 7K2QD-9VXMA-…；只显示这一次" }

    PersonAccess:
      type: object
      required: [userId, displayName, username, level, via, createdAt]
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        username: { type: string }
        level: { type: string, enum: [self, guardian, manage, read] }
        via: { type: string, description: "空：手动授权；emergency：紧急访问" }
        createdAt: { type: string, format: date-time }

    PersonEmergency:
      type: object
      required: [userId, displayName, waitHours, status]
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        waitHours: { type: integer }
        status: { type: string, enum: [idle, pending, granted] }
        reason: { type: string }
        requestedAt: { type: string, format: date-time }
        grantAt: { type: string, format: date-time, description: "申请没被拒绝时开始能看的时间" }
        grantedAt: { type: string, format: date-time }

    MyPrivacy:
      type: object
      required: [persons, uploaders, emergencyFor]
      properties:
        self: { type: integer, format: int64, description: "我在这个空间是哪位家人；没有关联时省略" }
        persons:
          type: array
          description: 我负责（本人或照看人）或被授权的家人
          items:
            type: object
            required: [id, name, privacy]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              privacy: { $ref: "#/components/schemas/PersonPrivacy" }
        uploaders:
          type: array
          description: 帮我负责的家人上传过私密文档、现在还能看的成员
          items:
            type: object
            required: [personId, userId, displayName, documents]
            properties:
              personId: { type: integer, format: int64 }
              userId: { type: integer, format: int64 }
              displayName: { type: string }
              documents: { type: integer }
        emergencyFor:
          type: array
          description: 我是紧急联系人的家人
          items:
            type: object
            required: [personId, name, emergency]
            properties:
              personId: { type: integer, format: int64 }
              name: { type: string }
              emergency: { $ref: "#/components/schemas/PersonEmergency" }

    TaxonomyItemInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "1 到 64 个字符，在空间内唯一（不区分英文大小写）" }
        rule: { $ref: "#/components/schemas/MatchRule" }

    TaxonomyItemPatch:
      type: object
      properties:
        name: { type: string }
        rule: { $ref: "#/components/schemas/MatchRule" }
        retentionMonths: { type: integer, minimum: 0, maximum: 600, description: "只用于类型（v1.6.5）：保留几个月，0 表示永久保留" }
        privateByDefault: { type: boolean, description: "只用于类型（v1.8.0）：这类文档选了家人后自动成为私密文档" }

    Tag:
      type: object
      required: [id, name, initial, sortKey, rule, color, isInbox, showInYearbook]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        initial: { type: string }
        sortKey: { type: string }
        rule: { $ref: "#/components/schemas/MatchRule" }
        color: { type: string, description: "12 种预设颜色之一（UI 设计规范 3.1）" }
        parentId: { type: integer, format: int64, description: "上级标签；顶层标签没有" }
        isInbox: { type: boolean }
        showInYearbook: { type: boolean, description: "用途标签：在年度回顾中显示小结" }
        documentCount: { type: integer, description: "文档数（含子标签上的文档，不含回收站）" }
        lastDocumentDate: { type: string, format: date }

    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string, description: "不传时按名称从预设颜色中取一个" }
        parentId: { type: integer, format: int64, description: "不传或 0 表示顶层" }
        rule: { $ref: "#/components/schemas/MatchRule" }
        showInYearbook: { type: boolean }

    TagPatch:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
        parentId: { type: integer, format: int64, description: "0 表示移到顶层；不传则不变" }
        rule: { $ref: "#/components/schemas/MatchRule" }
        showInYearbook: { type: boolean }

    CustomFieldExtra:
      type: object
      properties:
        currency: { type: string, description: "金额类型的币种，三位大写字母，默认 CNY" }
        options:
          type: array
          description: 单选类型的选项；新选项不带 id，已有选项改名时保留 id
          items: { $ref: "#/components/schemas/SelectOption" }
        multiline: { type: boolean, description: "文本类型显示为多行（v1.5.8），如保修条款、用药说明；最多 2000 字" }

    SelectOption:
      type: object
      required: [label]
      properties:
        id: { type: string }
        label: { type: string }

    CustomField:
      type: object
      required: [id, name, initial, sortKey, dataType, extra, builtIn]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, description: "内置字段的标识（amount、due_date）" }
        name: { type: string }
        initial: { type: string }
        sortKey: { type: string }
        dataType: { $ref: "#/components/schemas/CustomFieldType" }
        extra: { $ref: "#/components/schemas/CustomFieldExtra" }
        builtIn: { type: boolean }

    CustomFieldType:
      type: string
      description: 文本、整数、小数、布尔、日期、链接、金额、单选、文档链接
      enum: [text, integer, float, boolean, date, url, monetary, select, document_link]

    CustomFieldInput:
      type: object
      required: [name, dataType]
      properties:
        name: { type: string }
        dataType: { $ref: "#/components/schemas/CustomFieldType" }
        extra: { $ref: "#/components/schemas/CustomFieldExtra" }

    CustomFieldPatch:
      type: object
      description: 字段类型创建后不能修改；内置字段只能改名
      properties:
        name: { type: string }
        extra: { $ref: "#/components/schemas/CustomFieldExtra" }

    Branding:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "产品名称，默认“收好”" }
        logoUrl: { type: string, description: "自定义 Logo 的地址（带版本号）；使用默认 Logo 时没有" }

    UpdateBrandingRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "1 到 16 个字符" }

    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { type: integer, format: int64 }

    Job:
      type: object
      required: [id, kind, status, stage, progress, filename, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [ingest.document, ingest.reprocess] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        stage: { type: string, description: "queued、inspect、ocr、thumbnail、saving、done" }
        progress: { type: integer, description: "0–100" }
        filename: { type: string }
        error: { type: string, description: "失败的原因，可以直接显示" }
        documentId: { type: integer, format: int64, description: "生成的文档；重复上传失败时为已有的文档" }
        createdAt: { type: string, format: date-time }
        retryable: { type: boolean, description: "失败的上传，文件还在，调用者可以重试（v1.9.12，POST /jobs/{id}/retry）" }

    DocumentSummary:
      type: object
      required: [id, title, createdDate, addedAt, modifiedAt, mimeType, originalFilename, pageCount, hasArchive, hasThumbnail, inbox, tagIds, noteCount, drawerManual, isMilestone, isBook]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        createdDate: { type: string, format: date, description: "文档日期" }
        addedAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time, description: "保存修改时原样传回，用于检查修改冲突" }
        correspondentId: { type: integer, format: int64 }
        personId: { type: integer, format: int64, description: "家人（v1.6.3）" }
        locationId: { type: integer, format: int64, description: "原件的存放位置（v1.6.3）" }
        documentTypeId: { type: integer, format: int64 }
        tagIds:
          type: array
          items: { type: integer, format: int64 }
        asn: { type: integer, format: int64, description: "原件编号；没有时省略" }
        amount: { type: string, description: "内置字段“金额”，两位小数，如 326.40" }
        dueDate: { type: string, format: date, description: "内置字段“到期日”" }
        fieldValues:
          type: array
          description: 请求参数 fields 里的自定义字段中有值的那些（v1.5.6）
          items: { $ref: "#/components/schemas/FieldValue" }
        noteCount: { type: integer }
        mimeType: { type: string }
        originalFilename: { type: string }
        pageCount: { type: integer }
        hasArchive: { type: boolean, description: "有可搜索版（OCR 生成的 PDF/A）" }
        hasThumbnail: { type: boolean }
        inbox: { type: boolean, description: "在待整理中" }
        drawerId: { type: integer, format: int64, description: "所在抽屉；未入抽屉时省略" }
        drawerManual: { type: boolean, description: "手动放入（或手动设为未入抽屉），收纳规则不会移动它" }
        isMilestone: { type: boolean, description: "标记为大事，出现在年度回顾的大事记里" }
        sensitive: { type: boolean, description: "敏感文档（v1.6.4）：自己标了，或在敏感抽屉里。列表里没有命中片段；预览、文件和识别文字要先确认密码" }
        private: { type: boolean, description: "家人的私密文档（v1.8.0）：只有这位家人本人、照看人、被授权的人和上传者（没被收回时）看得到" }
        isBook: { type: boolean, description: "是书籍（有书目）" }
        hasCover: { type: boolean, description: "书籍有单独的封面图（GET /documents/{id}/cover）；没有时省略" }
        reading: { $ref: "#/components/schemas/ReadingSummary" }
        highlight:
          type: array
          description: 有关键词时：命中片段，按顺序拼起来即是片段原文，hit 为命中的词
          items: { $ref: "#/components/schemas/HighlightSegment" }

    HighlightSegment:
      type: object
      required: [text, hit]
      properties:
        text: { type: string }
        hit: { type: boolean }

    LinkedDocument:
      type: object
      description: 通过文档链接字段指向另一份的文档（v1.5.3）
      required: [id, title, createdDate, field]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        createdDate: { type: string, format: date }
        field: { type: string, description: "通过哪个字段链接" }

    FieldValue:
      type: object
      required: [fieldId, value]
      properties:
        fieldId: { type: integer, format: int64 }
        value:
          description: 按字段类型：文本、网址、日期（YYYY-MM-DD）、单选（选项 ID）为字符串；整数、文档链接为整数；小数为数字；布尔；金额为两位小数的字符串

    Document:
      allOf:
        - { $ref: "#/components/schemas/DocumentSummary" }
        - type: object
          required: [content, fields, checksum, fieldSources, source]
          properties:
            content: { type: string, description: "识别出的文字；敏感文档在没有确认密码时为空（locked）" }
            locked: { type: boolean, description: "敏感文档，还没有确认密码：识别文字、预览和文件都不给（v1.6.4）" }
            sensitiveMarked: { type: boolean, description: "文档自己标为敏感（不算抽屉的）" }
            contentEditedAt: { type: string, format: date-time, description: "识别文字最近一次人工修改的时间（v1.3.7）；没有改过或重新识别后省略" }
            source: { type: string, enum: [web, api, mobile, watch, mail, link, import, remote], description: "添加方式：网页上传、API、手机、监听目录、邮件、上传链接（v1.6.2）、从 Paperless 导入、远程收件夹（v1.7.7）" }
            pageEdits: { $ref: "#/components/schemas/PageEdits" }
            originalEncrypted: { type: boolean, description: "原件是加密的 PDF（预览与搜索使用解密后的可搜索版）" }
            conversionPending: { type: boolean, description: "Office 文档或邮件还没有转成 PDF：入库时没有配置 Gotenberg，配好后每小时自动转换一批（v1.9.1）" }
            fieldSources: { $ref: "#/components/schemas/FieldSources" }
            ruleDrawerId: { type: integer, format: int64, description: "手动放入的文档：按当前收纳规则本应放入的抽屉（交还给规则后的去向）；没有则省略" }
            hasLab: { type: boolean, description: "有识别出的检查结果（v1.9.11）；详情页只在这时取 /documents/{id}/lab" }
            fields:
              type: array
              description: 有值的自定义字段（含内置字段）
              items: { $ref: "#/components/schemas/FieldValue" }
            checksum: { type: string, description: "原件的 SHA-256" }
            linkedFrom:
              type: array
              description: 文档链接字段指向这份的文档（v1.5.3，最多 100 份，新的在前）
              items: { $ref: "#/components/schemas/LinkedDocument" }
            originalSize: { type: integer, format: int64, description: "原件的字节数" }
            archiveSize: { type: integer, format: int64, description: "可搜索版的字节数" }
            book: { $ref: "#/components/schemas/Book" }
            privacy: { $ref: "#/components/schemas/DocumentPrivacy" }

    DocumentPrivacy:
      type: object
      description: 我对这份文档隐私的权限（v1.8.0）
      required: [canEdit, canSetPrivate, asUploader]
      properties:
        canEdit: { type: boolean, description: "能修改（私密文档只有本人、照看人、代管人能改）" }
        canSetPrivate: { type: boolean, description: "能设为私密或取消私密（这位家人的本人；没有本人时是照看人）" }
        asUploader: { type: boolean, description: "我是因为上传了它才看得到，本人可以收回" }

    FieldSources:
      type: object
      description: 各字段的值从哪里来（设计文档 3.3）；没有记录的字段省略
      properties:
        type: { $ref: "#/components/schemas/FieldSource" }
        correspondent: { $ref: "#/components/schemas/FieldSource" }
        person: { $ref: "#/components/schemas/FieldSource" }
        date: { $ref: "#/components/schemas/FieldSource" }
        drawer: { $ref: "#/components/schemas/FieldSource" }
        tags:
          type: object
          description: 按标签 ID；source 为 user 而文档没有这个标签，表示是用户去掉的
          additionalProperties: { $ref: "#/components/schemas/FieldSource" }

    FieldSource:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [preset, rule, model, text, file, user, workflow, agent, similar]
          description: preset 上传时指定，rule 匹配规则，model 自动学习，text 从正文识别，file 文件名或照片的拍摄时间（日期，v1.4.4），user 用户改过，similar 相似文档（v0.5）
        basis: { type: string, description: "依据，如 关键词“国家电网”、识别出的日期原文（带前面的说明，如“开票日期：2024年3月5日”）" }
        confidence: { type: number, description: "自动学习的把握，0–1" }
        alternatives:
          type: array
          description: 日期：识别到的其他日期（v1.4.4，最多 5 个），详情页可以一键换用
          items:
            type: object
            required: [date, basis]
            properties:
              date: { type: string, format: date }
              basis: { type: string }

    ClassifierStatus:
      type: object
      required: [documentCount, minDocuments, items, training]
      properties:
        trainedAt: { type: string, format: date-time, description: "上次训练（或检查后确认无法训练）的时间；从未训练时省略" }
        documentCount: { type: integer, description: "上次训练用到的已整理文档数" }
        minDocuments: { type: integer, description: "训练至少需要的已整理文档数" }
        skipped:
          type: string
          enum: [too_few_documents, nothing_to_learn, no_words]
          description: 上次没有训练出模型的原因
        items:
          type: array
          description: 设为“自动学习”的对象及其样本数
          items: { $ref: "#/components/schemas/ClassifierItem" }
        training: { type: boolean, description: "训练任务在排队或进行中" }
        applying: { $ref: "#/components/schemas/ClassifyJob" }

    ClassifierItem:
      type: object
      required: [kind, id, samples, learned]
      properties:
        kind: { type: string, enum: [type, correspondent, person, tag] }
        id: { type: integer, format: int64 }
        samples: { type: integer, description: "有这一项的已整理文档数" }
        learned: { type: boolean, description: "样本够了，已经学会" }

    ClassifyJob:
      type: object
      description: 最近一次重新分类任务（24 小时内）
      required: [jobId, status, done, total, changed]
      properties:
        jobId: { type: integer, format: int64 }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        done: { type: integer }
        total: { type: integer }
        changed: { type: integer, description: "有改动的文档数" }

    MatchTest:
      type: object
      required: [rule, text]
      properties:
        rule: { $ref: "#/components/schemas/MatchRule" }
        text: { type: string, maxLength: 20000 }

    MatchTestResult:
      type: object
      required: [matched]
      properties:
        matched: { type: boolean }
        basis: { type: string, description: "如 关键词“国家电网”" }
        hits:
          type: array
          description: 文字里匹配到的部分
          items: { type: string }

    Task:
      type: object
      required: [id, kind, label, status, attempts, createdAt, group]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        label: { type: string, description: "任务种类的中文名称" }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        summary: { type: string, description: "对象或结果，如文件名、“共 95 份，改动 3 份”" }
        error: { type: string }
        attempts: { type: integer }
        documentId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        group: { $ref: "#/components/schemas/TaskGroup" }
        progress: { type: integer, minimum: 0, maximum: 100, description: "进行中的任务的进度百分比；不知道时省略（v1.7.14）" }
        creatorName: { type: string, description: "发起人；定时任务和系统任务省略（v1.7.14）" }
        retryable: { type: boolean, description: "失败的上传，文件还在，调用者可以重试（v1.9.12）" }
        expired: { type: boolean, description: "失败的上传，文件已经清理，只能重新上传（v1.9.12）" }

    TaskGroup:
      type: string
      enum: [upload, storage, organize, other]

    LogEntry:
      type: object
      required: [time, level, message, attrs]
      properties:
        time: { type: string, format: date-time }
        level: { type: string }
        message: { type: string }
        attrs:
          type: object
          additionalProperties: { type: string }

    SystemTool:
      type: object
      required: [name, available, purpose]
      properties:
        name: { type: string }
        available: { type: boolean }
        version: { type: string }
        purpose: { type: string }

    SystemStatus:
      type: object
      required: [version, commit, buildTime, goVersion, startedAt, storage, users, workspaces, documents, trash, indexDocuments, indexBehind, indexReady, jobsQueued, jobsRunning, jobsFailed, tools, integrity, backup, watch, smtp, settings]
      properties:
        version: { type: string }
        commit: { type: string }
        buildTime: { type: string }
        goVersion: { type: string }
        startedAt: { type: string, format: date-time }
        storage:
          type: object
          required: [database, index, media, backups, free]
          properties:
            database: { type: integer, format: int64 }
            index: { type: integer, format: int64 }
            media: { type: integer, format: int64 }
            backups: { type: integer, format: int64 }
            free: { type: integer, format: int64, description: "数据目录所在磁盘的剩余空间；-1 表示不知道" }
        users: { type: integer }
        workspaces: { type: integer }
        documents: { type: integer }
        trash: { type: integer }
        indexDocuments: { type: integer }
        indexBehind: { type: integer, description: "等待写入索引的文档" }
        indexReady: { type: boolean, description: "false：索引正在重建" }
        jobsQueued: { type: integer }
        jobsRunning: { type: integer }
        jobsFailed: { type: integer, description: "最近 24 小时失败的任务" }
        oldestQueued: { type: string, format: date-time }
        tools:
          type: array
          items: { $ref: "#/components/schemas/SystemTool" }
        integrity:
          type: array
          description: 每个空间最近一次完整性检查
          items:
            type: object
            required: [workspaceId, workspaceName, documents, missingCount, orphanCount, checkedAt]
            properties:
              workspaceId: { type: integer, format: int64 }
              workspaceName: { type: string }
              documents: { type: integer }
              missingCount: { type: integer }
              orphanCount: { type: integer }
              missingFiles:
                type: array
                items:
                  type: object
                  required: [documentId, title, file]
                  properties:
                    documentId: { type: integer, format: int64 }
                    title: { type: string }
                    file: { type: string }
              orphanFiles:
                type: array
                items: { type: string }
              checkedAt: { type: string, format: date-time }
        backup:
          type: object
          required: [snapshots]
          description: 自动备份（KEPT_BACKUP_DIR）
          properties:
            dir: { type: string, description: "备份目录：KEPT_BACKUP_DIR 或页面上设置的（v1.13.9）；没有时省略" }
            dirFromEnv: { type: boolean, description: "目录由部署配置决定，页面上不能改（v1.13.9）" }
            snapshots: { type: integer, description: "目录中的数据库快照数" }
            last:
              type: object
              required: [status, at]
              description: 最近一次备份任务
              properties:
                status: { type: string, enum: [queued, running, succeeded, failed] }
                at: { type: string, format: date-time, description: "完成时间；未完成时为排队时间" }
                snapshot: { type: string }
                documents: { type: integer }
                files: { type: integer }
                copied: { type: integer }
                bytes: { type: integer, format: int64 }
                missing: { type: integer, description: "数据目录中缺失、没有备份的文件数" }
                error: { type: string }
        watch:
          type: object
          required: [folders, waiting, failed]
          description: 监听目录（KEPT_CONSUME_DIR）
          properties:
            dir: { type: string, description: "没有配置时省略" }
            folders:
              type: array
              items:
                type: object
                required: [workspaceId, workspaceName, name]
                properties:
                  workspaceId: { type: integer, format: int64 }
                  workspaceName: { type: string }
                  name: { type: string, description: "空间文件夹的名称" }
            lastScan: { type: string, format: date-time }
            waiting: { type: integer, description: "还在写入或等待另一半的文件" }
            failed: { type: integer, description: "_未能入库 中的文件数" }
            error: { type: string, description: "最近一次扫描的错误" }
            versions: { type: boolean, description: "同一路径再次放入的文件作为新版本（v1.7.13）" }
        smtp:
          type: object
          required: [configured]
          description: 发信设置（KEPT_SMTP_*），不含密码
          properties:
            configured: { type: boolean }
            host: { type: string }
            port: { type: integer }
            security: { type: string, enum: [starttls, tls, none] }
            username: { type: string }
            from: { type: string }
            maxAttachments: { type: integer, format: int64, description: "一封邮件附件的总大小上限（字节）" }
        settings:
          type: object
          additionalProperties: { type: string }

    DrawerShare:
      type: object
      required: [workspaceId, name, kind, color, createdAt]
      properties:
        workspaceId: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        color: { type: string }
        createdAt: { type: string, format: date-time }

    SharedDrawer:
      type: object
      required: [id, name, icon, color, description, documentCount, sourceWorkspaceId, sourceWorkspaceName]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        icon: { $ref: "#/components/schemas/DrawerIcon" }
        color: { $ref: "#/components/schemas/DrawerColor" }
        description: { type: string }
        documentCount: { type: integer }
        sourceWorkspaceId: { type: integer, format: int64 }
        sourceWorkspaceName: { type: string }

    SharedDocumentSummary:
      type: object
      description: 共享来的文档；分类是来源空间的，所以直接给出名称
      required: [id, title, createdDate, modifiedAt, mimeType, pageCount, hasArchive, hasThumbnail, tagNames]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        createdDate: { type: string, format: date }
        modifiedAt: { type: string, format: date-time }
        sensitive: { type: boolean, description: "敏感文档（v1.6.4）：没有缩略图；打开前要确认自己的密码" }
        mimeType: { type: string }
        pageCount: { type: integer }
        hasArchive: { type: boolean }
        hasThumbnail: { type: boolean }
        typeName: { type: string }
        correspondentName: { type: string }
        tagNames:
          type: array
          items: { type: string }
        amount: { type: string }

    Collection:
      type: object
      required: [id, name, kind, documentCount, shares, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [documents, filter], description: "选定的文档，或筛选条件" }
        filter: { type: object, additionalProperties: true, description: "kind 为 filter 时" }
        documentCount: { type: integer, description: "现在符合的文档数（不含回收站）" }
        shares: { type: array, items: { $ref: "#/components/schemas/DrawerShare" } }
        createdAt: { type: string, format: date-time }

    SharedCollection:
      type: object
      required: [id, name, kind, documentCount, sourceWorkspaceName]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [documents, filter] }
        documentCount: { type: integer }
        sourceWorkspaceName: { type: string }

    SharedDocumentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SharedDocumentSummary" }
        total: { type: integer }
        nextCursor: { type: string }

    SharedDocument:
      allOf:
        - { $ref: "#/components/schemas/SharedDocumentSummary" }
        - type: object
          required: [content, originalFilename]
          properties:
            content: { type: string, description: "敏感文档在没有确认密码时为空（locked）" }
            originalFilename: { type: string }
            locked: { type: boolean, description: "敏感文档，还没有确认密码（v1.6.4）" }

    DrawerIcon:
      type: string
      enum: [home, car, heart, briefcase, baby, idcard, paw, wallet, plane, book, users, file, kanban, building]

    DrawerColor:
      type: string
      enum: [blue, cyan, green, orange, red, purple, pink, gray]

    Drawer:
      type: object
      required: [id, name, kind, icon, color, description, documentCount, alertCount, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [normal, library], description: "library 为书房：收纳所有书籍，排在最前，不能直接删除" }
        name: { type: string }
        icon: { $ref: "#/components/schemas/DrawerIcon" }
        color: { $ref: "#/components/schemas/DrawerColor" }
        description: { type: string }
        templateKey: { type: string, description: "用模板创建时的模板" }
        rule:
          type: object
          additionalProperties: true
          description: 收纳规则，筛选条件 JSON（11.9），关键词按子串匹配；没有规则时省略（不自动收纳）
        documentCount: { type: integer, description: "文档数（含待整理，不含回收站）" }
        alertCount: { type: integer, description: "未处理的提醒数" }
        sharedCount: { type: integer, description: "只读共享给了几个空间" }
        sensitive: { type: boolean, description: "敏感抽屉：里面的文档都算敏感文档（v1.6.4）" }
        sameNameVersions: { type: boolean, description: "上传同名文件直接作为新版本，不用询问（v1.7.13）" }
        primary: { $ref: "#/components/schemas/FactValue" }
        createdAt: { type: string, format: date-time }

    DrawerList:
      type: object
      required: [items, unfiled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Drawer" }
        unfiled: { type: integer, description: "未入抽屉的文档数" }

    DrawerDetail:
      allOf:
        - { $ref: "#/components/schemas/Drawer" }
        - type: object
          required: [facts, manualCount, firstYear, lastYear]
          properties:
            facts:
              type: array
              items: { $ref: "#/components/schemas/FactValue" }
            manualCount: { type: integer, description: "手动放入的文档数" }
            firstYear: { type: integer, description: "最早一份文档的年份；没有文档时为 0" }
            lastYear: { type: integer }

    DrawerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 20 }
        icon: { $ref: "#/components/schemas/DrawerIcon" }
        color: { $ref: "#/components/schemas/DrawerColor" }
        description: { type: string }
        rule: { type: object, additionalProperties: true }

    DrawerPatch:
      type: object
      properties:
        name: { type: string, maxLength: 20 }
        icon: { $ref: "#/components/schemas/DrawerIcon" }
        color: { $ref: "#/components/schemas/DrawerColor" }
        description: { type: string }
        rule: { type: object, additionalProperties: true, description: "新的收纳规则" }
        clearRule: { type: boolean, description: "去掉收纳规则（不再自动收纳）" }
        sensitive: { type: boolean, description: "敏感抽屉（v1.6.4）" }
        sameNameVersions: { type: boolean, description: "上传同名文件直接作为新版本（v1.7.13）" }

    DrawerSaved:
      type: object
      required: [drawer]
      properties:
        drawer: { $ref: "#/components/schemas/Drawer" }
        jobId: { type: integer, format: int64, description: "重新计算归属的后台任务；规则没变时省略" }

    DrawersCreated:
      type: object
      required: [drawers]
      properties:
        drawers:
          type: array
          items: { $ref: "#/components/schemas/Drawer" }
        jobId: { type: integer, format: int64 }

    JobStarted:
      type: object
      properties:
        jobId: { type: integer, format: int64 }

    IdList:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }

    TemplateKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }

    DrawerPreviewRequest:
      type: object
      description: drawerId 加 rule / clearRule 预览一条新规则；order 预览一种新顺序
      properties:
        drawerId: { type: integer, format: int64 }
        rule: { type: object, additionalProperties: true }
        clearRule: { type: boolean }
        order:
          type: array
          items: { type: integer, format: int64 }

    DrawerPreview:
      type: object
      required: [total, manual, in, new, out, unfiled, moves, samples]
      properties:
        total: { type: integer, description: "这个抽屉将收纳的文档数（含手动放入的）" }
        manual: { type: integer, description: "手动放入的，不受影响" }
        in: { type: integer, description: "将从其他抽屉移入" }
        new: { type: integer, description: "原来未入抽屉、将放进来" }
        out: { type: integer, description: "将移到其他抽屉" }
        unfiled: { type: integer, description: "将变为未入抽屉" }
        moves: { type: integer, description: "所有将移动的文档数" }
        samples:
          type: array
          items: { $ref: "#/components/schemas/DrawerMove" }

    DrawerMove:
      type: object
      required: [documentId, title]
      properties:
        documentId: { type: integer, format: int64 }
        title: { type: string }
        from: { type: integer, format: int64, description: "原来的抽屉；未入抽屉时省略" }
        to: { type: integer, format: int64, description: "将去的抽屉；变为未入抽屉时省略" }

    DrawerTemplates:
      type: object
      required: [scenes, templates]
      properties:
        scenes:
          type: array
          items:
            type: object
            required: [key, name, icon, description, templates]
            properties:
              key: { type: string }
              name: { type: string }
              icon: { type: string }
              description: { type: string }
              templates:
                type: array
                items: { type: string }
        templates:
          type: array
          items:
            type: object
            required: [key, name, icon, color, description, facts]
            properties:
              key: { type: string }
              name: { type: string }
              icon: { $ref: "#/components/schemas/DrawerIcon" }
              color: { $ref: "#/components/schemas/DrawerColor" }
              description: { type: string }
              facts:
                type: array
                description: 要点的名称
                items: { type: string }

    FactKind:
      type: string
      enum: [latest, due, sum, expect, pinned, metric]
      description: latest 最新值，due 到期，sum 汇总，expect 周期检查，pinned 固定文档，metric 指标（v1.8.3）

    FactConfig:
      type: object
      properties:
        tagIds:
          type: array
          description: 只统计带这些标签（含子标签）的文档
          items: { type: integer, format: int64 }
        filter: { type: object, additionalProperties: true, description: "筛选条件（固定文档以外的种类）：只统计符合的文档" }
        fieldId: { type: integer, format: int64, description: "latest：显示的字段；due：日期字段；sum：金额或数字字段" }
        advanceDays: { type: integer, description: "due：提前多少天提醒，默认 30" }
        period: { type: string, description: "sum：this_year | last_12_months | all（全部，月度小柱取最近有文档的 12 个月）；expect：monthly | quarterly | yearly" }
        graceDays: { type: integer, description: "expect：一个周期开始多少天后还没有文档才算缺失" }
        documentIds:
          type: array
          items: { type: integer, format: int64 }
        metricId: { type: integer, format: int64, description: "metric：指标" }
        personId: { type: integer, format: int64, description: "metric：哪位家人；省略时是最近测过的那位" }

    Fact:
      type: object
      required: [id, drawerId, kind, label, config]
      properties:
        id: { type: integer, format: int64 }
        drawerId: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/FactKind" }
        label: { type: string }
        config: { $ref: "#/components/schemas/FactConfig" }

    FactInput:
      type: object
      required: [kind, label, config]
      properties:
        kind: { $ref: "#/components/schemas/FactKind" }
        label: { type: string, maxLength: 20 }
        config: { $ref: "#/components/schemas/FactConfig" }

    FactPatch:
      type: object
      required: [label, config]
      properties:
        label: { type: string, maxLength: 20 }
        config: { $ref: "#/components/schemas/FactConfig" }

    DocRef:
      type: object
      required: [id, title, date]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        date: { type: string, format: date }

    FactValue:
      type: object
      description: 要点与它现在的值；只统计已整理的文档。按种类出现的字段见 kind
      required: [fact, warn]
      properties:
        fact: { $ref: "#/components/schemas/Fact" }
        document: { $ref: "#/components/schemas/DocRef" }
        fieldValue: { type: string, description: "latest：字段的值（金额为两位小数）" }
        fieldType: { type: string }
        dueDate: { type: string, format: date }
        daysLeft: { type: integer, description: "due：还剩几天，已过期为负数" }
        total: { type: string, description: "sum：合计（金额为两位小数）" }
        count: { type: integer }
        money: { type: boolean, description: "sum：合计是金额" }
        months:
          type: array
          description: sum：每月的合计，12 个月，旧的在前
          items:
            type: object
            required: [month, total]
            properties:
              month: { type: string }
              total: { type: string }
        periodLabel: { type: string, description: "expect：检查的周期，如“10 月”" }
        present: { type: boolean, description: "expect：这个周期已经有文档" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/DocRef" }
        warn: { type: boolean, description: "到期在提前天数内或已过期、周期文档缺失、指标超出范围" }
        filter: { type: object, additionalProperties: true, description: "在抽屉的文档列表里筛选出相关文档的条件" }
        metric:
          type: object
          description: metric：最近的值；没有看得到的值时省略
          required: [metricId, name, unit, date, text, flag, documentId, values]
          properties:
            metricId: { type: integer, format: int64 }
            personId: { type: integer, format: int64 }
            name: { type: string }
            unit: { type: string }
            date: { type: string }
            text: { type: string }
            flag: { type: string, enum: ["", high, low, abnormal] }
            value: { type: number, format: double }
            documentId: { type: integer, format: int64 }
            previous: { type: number, format: double }
            previousText: { type: string }
            values: { type: array, description: "最近十二次，从早到晚", items: { type: number, format: double } }

    Alert:
      type: object
      required: [id, drawerId, factId, kind, text, warn, createdAt]
      properties:
        id: { type: integer, format: int64 }
        drawerId: { type: integer, format: int64 }
        factId: { type: integer, format: int64 }
        kind: { type: string, enum: [due, missing] }
        documentId: { type: integer, format: int64 }
        dueDate: { type: string, format: date }
        daysLeft: { type: integer }
        periodLabel: { type: string }
        text: { type: string, description: "可以直接显示的提醒文字" }
        note: { type: string, description: "抽屉管家写的一句说明（v0.5，AI 生成）；没有或关闭了抽屉管家时省略" }
        warn: { type: boolean, description: "已过期、30 天内到期或文档缺失" }
        createdAt: { type: string, format: date-time }

    Yearbook:
      type: object
      required: [year, documents, newCorrespondents, busiestMonth, months, drawers, unfiled, tags, events, books, booksFinished]
      properties:
        books:
          type: array
          description: 调用者自己这一年读完的书，按读完的日期（v0.4）
          items: { $ref: "#/components/schemas/YearBook" }
        booksFinished: { type: integer, description: "调用者这一年读完的书的本数" }
        narrativeAvailable: { type: boolean, description: "可以让 AI 写叙述：开启了 AI 和年度回顾叙述（v0.5）" }
        narrative:
          type: object
          description: 抽屉管家写的叙述（v0.5，AI 生成）；没有或关闭时省略
          required: [text, createdAt, stale]
          properties:
            text: { type: string }
            createdAt: { type: string, format: date-time }
            stale: { type: boolean, description: "写好之后这一年的数据有变化" }
        year: { type: integer }
        asOf: { type: string, format: date, description: "今年的回顾截至今天；往年省略" }
        documents: { type: integer }
        newCorrespondents: { type: integer, description: "第一份文档在这一年的往来方数" }
        topType:
          type: object
          required: [id, name, count]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            count: { type: integer }
        busiestMonth: { type: integer, description: "1–12；没有文档时为 0" }
        months:
          type: array
          items: { type: integer }
        drawers: { type: array, items: { $ref: "#/components/schemas/YearbookDrawer" } }
        unfiled: { type: integer }
        tags: { type: array, items: { $ref: "#/components/schemas/YearbookTag" } }
        events:
          type: array
          items:
            type: object
            required: [date, kind, text]
            properties:
              date: { type: string, description: "MM-DD" }
              kind: { type: string, enum: [rule, drawer, milestone], description: "rule 为大事记规则命中的文档，milestone 为标记为大事的文档" }
              text: { type: string }
              documentId: { type: integer, format: int64 }
              drawerId: { type: integer, format: int64 }
        previous:
          type: object
          description: 上一年的同口径数字，用于对比
          required: [year, documents, drawers, tags]
          properties:
            year: { type: integer }
            documents: { type: integer }
            drawers: { type: array, items: { $ref: "#/components/schemas/YearbookDrawer" } }
            tags: { type: array, items: { $ref: "#/components/schemas/YearbookTag" } }
        history:
          type: array
          description: 截至这一年的近五年，每年的份数（从早到晚）
          items:
            type: object
            required: [year, documents]
            properties:
              year: { type: integer }
              documents: { type: integer }
        storage:
          type: object
          description: 这一年的文档占用的空间（字节）；workspace 为整个空间（不含回收站）
          required: [originals, searchable, thumbnails, versions, total, largest, workspace]
          properties:
            originals: { type: integer, format: int64 }
            searchable: { type: integer, format: int64 }
            thumbnails: { type: integer, format: int64 }
            versions: { type: integer, format: int64 }
            total: { type: integer, format: int64 }
            workspace: { type: integer, format: int64 }
            largest:
              type: array
              items:
                type: object
                required: [id, title, bytes]
                properties:
                  id: { type: integer, format: int64 }
                  title: { type: string }
                  bytes: { type: integer, format: int64 }

    YearBook:
      type: object
      required: [id, title, finishedOn, rating, hasCover, hasThumbnail]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        finishedOn: { type: string, format: date }
        rating: { type: integer, description: "0 表示没有评分" }
        hasCover: { type: boolean }
        hasThumbnail: { type: boolean }

    YearbookDrawer:
      type: object
      required: [id, name, icon, color, count, sums]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        icon: { $ref: "#/components/schemas/DrawerIcon" }
        color: { $ref: "#/components/schemas/DrawerColor" }
        count: { type: integer }
        sums:
          type: array
          items:
            type: object
            required: [label, total, money]
            properties:
              label: { type: string }
              total: { type: string }
              money: { type: boolean }

    YearbookTag:
      type: object
      required: [id, name, color, count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        color: { type: string }
        count: { type: integer }
        amount: { type: string, description: "内置字段“金额”的合计" }

    MilestoneRules:
      type: object
      required: [rules, default]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [verb, filter]
            properties:
              verb: { type: string, description: "1 到 8 个字，如“签订”" }
              filter: { type: object, additionalProperties: true, description: "筛选条件 JSON（11.9），关键词按子串匹配" }
        default: { type: boolean, description: "是默认规则（没有改过，或已恢复默认）" }

    DocumentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
        total: { type: integer, description: "符合条件的总数" }
        nextCursor: { type: string, description: "还有下一页时返回" }
        truncated: { type: boolean, description: "关键词命中的文档超过召回上限（KEPT_SEARCH_LIMIT），只包含相关度最高的那些" }

    DocumentPatch:
      type: object
      properties:
        title: { type: string }
        createdDate: { type: string, description: "YYYY-MM-DD" }
        documentTypeId: { type: integer, format: int64, description: "0 表示清空" }
        correspondentId: { type: integer, format: int64, description: "0 表示清空" }
        personId: { type: integer, format: int64, description: "家人（v1.6.3）；0 表示清空" }
        locationId: { type: integer, format: int64, description: "原件的存放位置（v1.6.3）；0 表示清空" }
        tagIds:
          type: array
          description: 标签的完整列表（替换原有的）
          items: { type: integer, format: int64 }
        asn: { type: integer, format: int64, description: "原件编号，0 表示清空" }
        customFields:
          type: array
          description: 要修改的自定义字段；value 为 null 表示清空
          items: { $ref: "#/components/schemas/FieldValue" }
        inbox: { type: boolean, description: "false 表示完成整理" }
        drawerId: { type: integer, format: int64, description: "手动放入抽屉，0 表示手动设为未入抽屉" }
        drawerAuto: { type: boolean, description: "交还给收纳规则" }
        isMilestone: { type: boolean }
        sensitive: { type: boolean, description: "标为敏感文档（v1.6.4）" }
        private: { type: boolean, description: "设为家人的私密文档（v1.8.0），文档要有家人；只有这位家人本人（没有本人时是照看人）可以改" }
        content: { type: string, description: "人工修正后的识别文字（v1.3.7），最多 100 万字；搜索索引随之重建，重新识别时会被覆盖" }
        modifiedAt: { type: string, format: date-time, description: "读取时的修改时间；与当前不一致时返回 409" }

    Facets:
      type: object
      additionalProperties:
        type: array
        items: { $ref: "#/components/schemas/FacetBucket" }

    FacetBucket:
      type: object
      required: [key, count]
      properties:
        key: { type: string, description: "ID、年份（2024）、月份（2024-03）或 none" }
        count: { type: integer, format: int64 }

    BulkRequest:
      type: object
      properties:
        ids:
          type: array
          items: { type: integer, format: int64 }
        filter:
          type: object
          description: 筛选条件 JSON（设计文档 11.9）
          additionalProperties: true
        edit: { $ref: "#/components/schemas/BulkEdit" }
        delete: { type: boolean }
        reprocess: { type: boolean }
        classify: { $ref: "#/components/schemas/BulkClassify" }

    BulkClassify:
      type: object
      description: 重新应用自动分类（后台任务）。用户改过的字段不会被改动
      required: [mode]
      properties:
        mode:
          type: string
          enum: [fill, overwrite]
          description: fill 只补空（只填空的类型和往来方、只增加标签）；overwrite 用新结果替换以前自动分类的结果

    BulkEdit:
      type: object
      properties:
        documentTypeId: { type: integer, format: int64, description: "0 表示清空" }
        correspondentId: { type: integer, format: int64, description: "0 表示清空" }
        personId: { type: integer, format: int64, description: "家人（v1.6.3）；0 表示清空" }
        locationId: { type: integer, format: int64, description: "存放位置（v1.6.3）；0 表示清空" }
        addTagIds:
          type: array
          items: { type: integer, format: int64 }
        removeTagIds:
          type: array
          items: { type: integer, format: int64 }
        customFields:
          type: array
          items: { $ref: "#/components/schemas/FieldValue" }
        inbox: { type: boolean, description: "false 表示完成整理" }
        drawerId: { type: integer, format: int64, description: "手动放入抽屉，0 表示手动设为未入抽屉" }

    BulkResult:
      type: object
      required: [count]
      properties:
        count: { type: integer, description: "受影响的文档数" }
        jobIds:
          type: array
          description: 重新处理时为每份文档创建的任务；重新分类时为那一个任务
          items: { type: integer, format: int64 }

    TrashedDocument:
      type: object
      required: [id, title, deletedAt, daysLeft]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        correspondentId: { type: integer, format: int64 }
        documentTypeId: { type: integer, format: int64 }
        deletedAt: { type: string, format: date-time }
        daysLeft: { type: integer, description: "还剩几天自动彻底删除" }

    Book:
      type: object
      required: [documentId, isbn, authors, publisher, series, edition, published, pages, language, description, hasCover, updatedAt]
      properties:
        documentId: { type: integer, format: int64 }
        isbn: { type: string, description: "13 位 ISBN，不带连字符；没有时为空" }
        authors:
          type: array
          items: { type: string }
        publisher: { type: string }
        series: { type: string, description: "丛书" }
        edition: { type: string, description: "版次，如 第 2 版" }
        published: { type: string, description: "出版时间，如 2019 或 2019-05" }
        pages: { type: integer, description: "页数；不知道时为 0" }
        language: { type: string }
        description: { type: string, description: "简介" }
        hasCover: { type: boolean, description: "有单独的封面图（否则用缩略图）" }
        updatedAt: { type: string, format: date-time }

    ReadingProgress:
      type: object
      required: [position, percent, status, rating, startedOn, finishedOn, highlightCount]
      properties:
        position: { type: string, description: "PDF 为 page:页码，EPUB 为 CFI；没有读过时为空" }
        percent: { type: number, format: double, description: "读了多少，0–1" }
        status: { $ref: "#/components/schemas/ReadingStatus" }
        rating: { type: integer, minimum: 0, maximum: 5, description: "评分，0 表示没有评" }
        startedOn: { type: string, description: "开始读的日期 YYYY-MM-DD；没有时为空" }
        finishedOn: { type: string, description: "读完的日期；没有时为空" }
        highlightCount: { type: integer, description: "自己在这份文档里的高亮和批注条数" }
        updatedAt: { type: string, format: date-time }

    ReadingSummary:
      type: object
      description: 调用者自己的阅读状态与进度（文档列表中）；没有时省略
      required: [status, percent]
      properties:
        status: { $ref: "#/components/schemas/ReadingStatus" }
        percent: { type: number, format: double }

    ReadingStatus:
      type: string
      enum: ["", want, reading, finished]
      description: 空为没有标记；want 想读，reading 在读，finished 读完

    ReadingStatePatch:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ReadingStatus" }
        rating: { type: integer, minimum: 0, maximum: 5 }
        startedOn: { type: string, description: "YYYY-MM-DD，空串清除" }
        finishedOn: { type: string, description: "YYYY-MM-DD，空串清除" }

    HighlightColor:
      type: string
      enum: [yellow, green, blue, pink]

    BookSummary:
      type: object
      required: [summary, chapters, createdAt, stale]
      properties:
        summary: { type: string }
        chapters:
          type: array
          items:
            type: object
            required: [title, points]
            properties:
              title: { type: string }
              points: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        stale: { type: boolean, description: "写好之后正文有变化" }

    ReviewCard:
      type: object
      required: [id, documentId, documentTitle, front, back, dueOn, intervalDays, reps, lapses, createdAt]
      properties:
        id: { type: integer, format: int64 }
        documentId: { type: integer, format: int64 }
        documentTitle: { type: string }
        highlightId: { type: integer, format: int64, description: "高亮删除后省略" }
        quote: { type: string, description: "对应高亮的摘录" }
        front: { type: string }
        back: { type: string }
        dueOn: { type: string, format: date }
        intervalDays: { type: integer }
        reps: { type: integer }
        lapses: { type: integer }
        createdAt: { type: string, format: date-time }

    Highlight:
      type: object
      required: [id, documentId, locator, quote, note, color, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        documentId: { type: integer, format: int64 }
        documentTitle: { type: string, description: "searchHighlights 时给出" }
        locator: { type: string, description: "EPUB 为 CFI 范围，PDF 为 page:页码" }
        quote: { type: string, description: "选中的文字；给一页写的批注为空" }
        note: { type: string }
        color: { $ref: "#/components/schemas/HighlightColor" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HighlightInput:
      type: object
      required: [locator]
      properties:
        locator: { type: string, maxLength: 2000 }
        quote: { type: string, maxLength: 2000 }
        note: { type: string, maxLength: 5000 }
        color: { $ref: "#/components/schemas/HighlightColor" }

    HighlightPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Highlight" }
        nextCursor: { type: string, description: "下一页；没有更多时省略" }

    BookList:
      type: object
      required: [id, name, description, count, preview, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        count: { type: integer, description: "本数（不含回收站里的）" }
        preview:
          type: array
          description: 前 4 本
          items: { $ref: "#/components/schemas/BookListItem" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookListDetail:
      allOf:
        - { $ref: "#/components/schemas/BookList" }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BookListItem" }

    BookListItem:
      type: object
      required: [documentId, title, authors, hasCover, hasThumbnail, note, addedAt]
      properties:
        documentId: { type: integer, format: int64 }
        title: { type: string }
        authors:
          type: array
          items: { type: string }
        hasCover: { type: boolean }
        hasThumbnail: { type: boolean }
        note: { type: string, description: "推荐语" }
        addedAt: { type: string, format: date-time }
        reading: { $ref: "#/components/schemas/ReadingSummary" }

    BookListInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 500 }

    QAConversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, description: "第一个问题的开头；还没有问过时为空" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messages:
          type: array
          description: 只在取单个对话时给出
          items: { $ref: "#/components/schemas/QAMessage" }

    QAMessage:
      type: object
      required: [id, role, content, sources, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/QASource" }
        status: { type: string, enum: [done, stopped, failed] }
        createdAt: { type: string, format: date-time }

    DocAnswer:
      type: object
      required: [content, sources, status]
      properties:
        content: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/QASource" }, description: "给模型的段落；cited 为回答里引用了的" }
        status: { type: string, enum: [done, stopped, failed] }

    QASource:
      type: object
      required: [n, documentId, title, date, snippet, cited]
      properties:
        n: { type: integer, description: "回答里的 [n]" }
        documentId: { type: integer, format: int64 }
        title: { type: string }
        date: { type: string, format: date }
        snippet: { type: string }
        cited: { type: boolean, description: "回答引用了它" }

    BookSource:
      type: string
      enum: [openlibrary, googlebooks, custom]

    BookLookup:
      type: object
      required: [isbn, results, failures]
      properties:
        isbn: { type: string, description: "13 位 ISBN" }
        results:
          type: array
          description: 找到了这本书的数据源，按配置的顺序
          items: { $ref: "#/components/schemas/BookLookupResult" }
        failures:
          type: array
          description: 没能查询的数据源（连不上、超时、超出配额等）；没有这本书的不算
          items:
            type: object
            required: [source, sourceName, message]
            properties:
              source: { $ref: "#/components/schemas/BookSource" }
              sourceName: { type: string }
              message: { type: string }

    BookLookupResult:
      type: object
      required: [source, sourceName, title, authors, publisher, published, pages, language, description, series, hasCover]
      properties:
        source: { $ref: "#/components/schemas/BookSource" }
        sourceName: { type: string, description: "如 Open Library" }
        title: { type: string, description: "书名（有副书名时用冒号连在后面）" }
        authors:
          type: array
          items: { type: string }
        publisher: { type: string }
        published: { type: string }
        pages: { type: integer }
        language: { type: string }
        description: { type: string }
        series: { type: string }
        hasCover: { type: boolean, description: "这个数据源有封面，可以用 fetchBookCover 保存" }

    BookInput:
      type: object
      properties:
        isbn: { type: string, maxLength: 20 }
        authors:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        publisher: { type: string, maxLength: 200 }
        series: { type: string, maxLength: 200 }
        edition: { type: string, maxLength: 200 }
        published: { type: string, maxLength: 200 }
        pages: { type: integer, minimum: 0, maximum: 100000 }
        language: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }

    Note:
      type: object
      required: [id, body, authorName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string }
        authorId: { type: integer, format: int64, description: "账号已不存在时省略" }
        authorName: { type: string, description: "账号已不存在时为空" }
        createdAt: { type: string, format: date-time }

    NoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string, description: "1 到 2000 个字" }

    SavedView:
      type: object
      required: [id, name, filter, sort, display, creatorName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        filter:
          type: object
          additionalProperties: true
        sort: { type: string, description: "如 created:desc；空表示列表的默认排序" }
        display: { $ref: "#/components/schemas/ViewDisplay" }
        createdBy: { type: integer, format: int64 }
        creatorName: { type: string }
        createdAt: { type: string, format: date-time }

    ViewDisplay:
      type: object
      description: 列表的显示方式；省略的项用默认值
      properties:
        view: { type: string, enum: [list, grid] }
        columns:
          type: array
          description: 标题之外显示的列，按顺序
          items: { type: string, pattern: '^(correspondent|person|location|type|drawer|date|tags|asn|added|amount|dueDate|notes|pages|field:[0-9]{1,18})$', description: "field:字段ID 为自定义字段（v1.5.6）；notes 备注数、pages 页数（v1.6.0）；person 家人、location 存放位置（v1.6.3）" }

    SavedViewInput:
      type: object
      required: [name, filter]
      properties:
        name: { type: string, description: "1 到 32 个字，在空间内唯一" }
        filter:
          type: object
          additionalProperties: true
        sort: { type: string }
        display: { $ref: "#/components/schemas/ViewDisplay" }

    SavedViewPatch:
      type: object
      properties:
        name: { type: string }
        filter:
          type: object
          additionalProperties: true
        sort: { type: string }
        display: { $ref: "#/components/schemas/ViewDisplay" }

    Locale:
      type: string
      enum: ["", zh, en]
      description: 网页的界面语言（v1.10.0）：空为跟随浏览器

    Me:
      type: object
      required: [user, workspace, locale]
      properties:
        user: { $ref: "#/components/schemas/User" }
        locale: { $ref: "#/components/schemas/Locale" }
        workspace: { $ref: "#/components/schemas/Workspace" }
        features:
          type: object
          required: [smtp]
          description: 实例配置的可选功能
          properties:
            smtp: { type: boolean, description: "已配置发信（KEPT_SMTP_HOST），可以通过邮件发送文档" }
            bookLookup: { type: boolean, description: "可以按 ISBN 在线查找书目（KEPT_BOOK_SOURCES 不是 none）" }
            mailBody: { type: boolean, description: "可以把邮件正文存成 PDF（配置了 KEPT_GOTENBERG_URL，v1.4.0）" }
            watermark: { type: boolean, description: "分享可以加水印：有中文字体和 qpdf（v1.9.2）" }
        csrfToken:
          type: string
          description: 仅 Cookie 会话返回；修改类请求需放在 X-CSRF-Token 请求头中
        verifiedUntil: { type: string, format: date-time, description: "确认过密码，到这个时间前可以打开敏感文档（v1.6.4）；没有确认或已过期时省略" }

    WorkflowTrigger:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [consumption, added, updated, scheduled], description: "入库时（自动分类之前）、添加后、修改后（有人修改元数据）、定时" }
        field: { type: string, description: "定时：created 文档日期、added 添加时间或 cf:<日期类自定义字段 ID>" }
        offsetDays: { type: integer, description: "定时：日期之后多少天（负数为之前）" }
        repeatDays: { type: integer, description: "定时：之后每隔多少天再运行；0 只运行一次" }

    WorkflowConditions:
      type: object
      properties:
        filename: { type: string, description: "原文件名的通配符（*、?），不区分大小写" }
        sources: { type: array, items: { type: string, enum: [web, api, mobile, watch, mail, link, import, remote] }, description: "来源；为空表示不限" }
        filter:
          type: object
          additionalProperties: true
          description: 文档条件，筛选条件 JSON（11.9），关键词按子串匹配；入库时只判断关键词

    WorkflowFieldValue:
      type: object
      required: [fieldId]
      properties:
        fieldId: { type: integer, format: int64 }
        value: { description: "与修改文档时的自定义字段值相同；null 清空" }

    WorkflowAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [assign, remove, email, webhook] }
        title: { type: string, description: "assign：标题模板（占位符见设计文档）" }
        typeId: { type: integer, format: int64 }
        correspondentId: { type: integer, format: int64 }
        personId: { type: integer, format: int64, description: "assign：设家人（v1.6.3）" }
        tagIds: { type: array, items: { type: integer, format: int64 }, description: "assign：加上的标签；remove：去掉的标签" }
        drawerId: { type: integer, format: int64 }
        customFields: { type: array, items: { $ref: "#/components/schemas/WorkflowFieldValue" } }
        allTags: { type: boolean, description: "remove：去掉全部标签" }
        clearType: { type: boolean }
        clearCorrespondent: { type: boolean }
        clearPerson: { type: boolean, description: "remove：清除家人（v1.6.3）" }
        to: { type: array, items: { type: string }, description: "email：收件人" }
        subject: { type: string, description: "email：主题模板，默认 {标题}" }
        body: { type: string, description: "email：正文模板；webhook：请求体模板（为空时发送默认的 JSON）" }
        attach: { type: boolean, description: "email：附上可搜索版；webhook：附上文件，按 multipart/form-data 发送，JSON 在 payload 部分、文件在 file 部分（v1.6.5，超过 50 MB 的只发 JSON；敏感文档不附）" }
        file: { type: string, enum: [archive, original], description: "webhook 附上的文件：archive 可搜索版（没有时用原件，默认）或 original 原件" }
        url: { type: string, description: "webhook：地址" }
        headers: { type: object, additionalProperties: { type: string }, description: "webhook：请求头" }

    WorkflowInput:
      type: object
      required: [name, enabled, triggers, conditions, actions]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        triggers: { type: array, items: { $ref: "#/components/schemas/WorkflowTrigger" } }
        conditions: { $ref: "#/components/schemas/WorkflowConditions" }
        actions: { type: array, items: { $ref: "#/components/schemas/WorkflowAction" } }

    Workflow:
      type: object
      required: [id, name, enabled, sortOrder, triggers, conditions, actions, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        sortOrder: { type: integer }
        triggers: { type: array, items: { $ref: "#/components/schemas/WorkflowTrigger" } }
        conditions: { $ref: "#/components/schemas/WorkflowConditions" }
        actions: { type: array, items: { $ref: "#/components/schemas/WorkflowAction" } }
        lastRunAt: { type: string, format: date-time }
        lastStatus: { type: string, enum: [ok, failed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkflowRun:
      type: object
      required: [id, trigger, status, message, createdAt]
      properties:
        id: { type: integer, format: int64 }
        documentId: { type: integer, format: int64 }
        documentTitle: { type: string }
        trigger: { type: string, enum: [consumption, added, updated, scheduled] }
        status: { type: string, enum: [ok, failed] }
        message: { type: string, description: "做了什么，或失败的原因" }
        createdAt: { type: string, format: date-time }

    DocumentVersion:
      type: object
      required: [id, number, label, filename, mimeType, size, encrypted, current, creatorName, createdAt]
      properties:
        id: { type: integer, format: int64, description: "0 为从没上传过新版本的文档的第 1 版" }
        number: { type: integer }
        label: { type: string }
        filename: { type: string }
        mimeType: { type: string }
        size: { type: integer, format: int64 }
        encrypted: { type: boolean, description: "加密的 PDF" }
        current: { type: boolean }
        creatorName: { type: string }
        createdAt: { type: string, format: date-time }

    DuplicatePair:
      type: object
      required: [id, similarity, a, b, aSnippet, bSnippet, foundAt]
      properties:
        id: { type: integer, format: int64 }
        similarity: { type: integer, description: "相似度（百分比）" }
        a: { $ref: "#/components/schemas/DocumentSummary" }
        b: { $ref: "#/components/schemas/DocumentSummary" }
        aSnippet: { type: string, description: "正文开头" }
        bSnippet: { type: string }
        foundAt: { type: string, format: date-time }

    OFDSignature:
      type: object
      description: OFD 的一个电子签章和验证结果（v1.11.3）
      required: [type, status, outsideValidity, selfSigned, certInSeal, hasSeal, files, unsigned]
      properties:
        type: { type: string, description: "Seal 电子签章；Sign 不带印章的数字签名" }
        status: { type: string, enum: [valid, changed, unknown], description: "valid 签完以后没有改动、签名对得上；changed 被改过；unknown 无法验证" }
        reason: { type: string, description: "不是 valid 时的原因" }
        page: { type: integer, description: "印章所在的页，从 1 数" }
        time: { type: string, format: date-time, description: "签章时间" }
        provider: { type: string, description: "签章软件" }
        sealName: { type: string, description: "印章名称" }
        signer: { type: string, description: "签章人（证书的名称）" }
        org: { type: string, description: "签章人的单位" }
        issuer: { type: string, description: "证书的签发者" }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        outsideValidity: { type: boolean, description: "签章时间不在证书有效期内" }
        selfSigned: { type: boolean, description: "证书是自己签发的（已验证自签名）" }
        certInSeal: { type: boolean, description: "签章人的证书是印章登记的证书" }
        version: { type: integer, description: "签章数据的版本：4（GB/T 38540）或 1（GM/T 0031）" }
        hasSeal: { type: boolean, description: "有能显示的印章图片（PNG、JPEG）" }
        files:
          type: array
          items:
            type: object
            required: [path, ok, missing]
            properties:
              path: { type: string }
              ok: { type: boolean }
              missing: { type: boolean }
        unsigned: { type: array, items: { type: string }, description: "包里不在签名范围内的文件" }

    WordDocument:
      type: object
      description: Word 阅读视图（v1.9.8）
      required: [blocks, notes, images, baseSize, truncated]
      properties:
        blocks: { type: array, items: { $ref: "#/components/schemas/WordBlock" } }
        notes: { type: array, items: { $ref: "#/components/schemas/WordNote" }, description: "脚注和尾注，按第一次引用的顺序编号" }
        images: { type: array, items: { $ref: "#/components/schemas/WordImage" }, description: "图片的显示尺寸，按序号排列" }
        baseSize: { type: number, description: "正文字号（磅）；WordRun.size 按它算相对大小" }
        truncated: { type: boolean, description: "超过 20000 块，后面的没有读" }
    WordBlock:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [paragraph, table, box] }
        heading: { type: integer, description: "标题层级 1–6；正文不给" }
        align: { type: string, enum: [center, right, justify] }
        list: { $ref: "#/components/schemas/WordList" }
        runs: { type: array, items: { $ref: "#/components/schemas/WordRun" } }
        rows: { type: array, items: { type: array, items: { $ref: "#/components/schemas/WordCell" } }, description: "表格的行；被纵向合并掉的单元格不列出" }
        headerRows: { type: integer, description: "开头几行是标题行" }
        blocks: { type: array, items: { $ref: "#/components/schemas/WordBlock" }, description: "文本框里的内容" }
    WordList:
      type: object
      required: [marker, level]
      properties:
        marker: { type: string, description: "编号或项目符号，如“一、”“1.2”“•”；空串表示不显示" }
        level: { type: integer }
    WordCell:
      type: object
      required: [blocks, colSpan, rowSpan]
      properties:
        blocks: { type: array, items: { $ref: "#/components/schemas/WordBlock" } }
        colSpan: { type: integer }
        rowSpan: { type: integer }
    WordNote:
      type: object
      required: [n, blocks]
      properties:
        n: { type: integer }
        blocks: { type: array, items: { $ref: "#/components/schemas/WordBlock" } }
    WordImage:
      type: object
      description: 图片的显示尺寸（96 dpi 的像素，0 表示文件里没写）
      required: [width, height]
      properties:
        width: { type: integer }
        height: { type: integer }
    WordRun:
      type: object
      properties:
        text: { type: string }
        bold: { type: boolean }
        italic: { type: boolean }
        underline: { type: boolean }
        strike: { type: boolean }
        color: { type: string, description: "RRGGBB" }
        highlight: { type: string, description: "RRGGBB" }
        size: { type: number, description: "字号（磅）；和正文一样时不给" }
        vert: { type: string, enum: [super, sub] }
        link: { type: string, description: "只有 http、https、mailto" }
        image: { type: integer, description: "图片序号（从 1 数）" }
        note: { type: integer, description: "脚注或尾注的编号" }
    FileInfo:
      type: object
      required: [mimeType, props, hasLocation]
      properties:
        mimeType: { type: string, description: "原件的格式（MIME）" }
        archiveChecksum: { type: string, description: "可搜索版的 SHA-256；没有可搜索版时省略" }
        props:
          type: array
          description: 原件自带的属性，按显示顺序：PDF 的标题、作者、创建软件、生成工具、时间、版本、页面大小；照片的拍摄时间、相机、软件、尺寸
          items: { $ref: "#/components/schemas/FileProp" }
        takenOn: { type: string, format: date, description: "照片的拍摄日期；没有时省略" }
        hasLocation: { type: boolean, description: "照片带有位置信息（不返回坐标）" }

    MoveResult:
      type: object
      required: [moved, workspaceId, workspaceName, asnCleared, created]
      properties:
        moved: { type: integer, description: "移过去的份数" }
        workspaceId: { type: integer, format: int64 }
        workspaceName: { type: string }
        asnCleared:
          type: array
          description: 原件编号在目标空间已被占用、因此清空了的文档
          items: { type: integer, format: int64 }
        created:
          type: array
          description: 在目标空间新建的类型、往来方、标签、字段，如“标签“医疗””
          items: { type: string }

    FileProp:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }

    DuplicateList:
      type: object
      required: [pairs, scanning]
      properties:
        pairs: { type: array, items: { $ref: "#/components/schemas/DuplicatePair" } }
        lastScanAt: { type: string, format: date-time, description: "最近一次检查完成的时间" }
        scanning: { type: boolean, description: "正在检查" }

    ShareLink:
      type: object
      required: [id, documentId, token, file, expiresAt, createdAt, creatorName, accessCount, allowDownload]
      properties:
        watermark: { type: string, description: "水印文字（v1.9.2）；没有时省略" }
        allowDownload: { type: boolean, description: "允许下载（v1.9.2）" }
        id: { type: integer, format: int64 }
        documentId: { type: integer, format: int64 }
        token: { type: string, description: "链接为 /s/<token>" }
        file: { type: string, enum: [archive, original] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        creatorName: { type: string }
        accessCount: { type: integer, description: "文件被打开或下载的次数" }
        lastAccessAt: { type: string, format: date-time }

    ActiveShare:
      type: object
      required: [kind, id, title, documents, token, file, expiresAt, createdAt, creatorName, accessCount, allowDownload]
      properties:
        watermark: { type: string, description: "水印文字（v1.9.2）；没有时省略" }
        allowDownload: { type: boolean, description: "允许下载（v1.9.2）" }
        kind: { type: string, enum: [document, bundle], description: "单份文档的链接或分享包" }
        id: { type: integer, format: int64, description: "链接或分享包的 ID（作废时用对应的接口）" }
        title: { type: string }
        documentId: { type: integer, format: int64, description: "单份文档的链接：那份文档" }
        documents: { type: integer, description: "分享包里还在的文档份数；单份文档为 1" }
        token: { type: string, description: "单份文档的链接为 /s/<token>，分享包为 /b/<token>" }
        file: { type: string, enum: [archive, original] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        creatorName: { type: string }
        accessCount: { type: integer }
        lastAccessAt: { type: string, format: date-time }

    ChecklistItem:
      type: object
      required: [label, filter]
      properties:
        id: { type: string, description: "项目 ID；新项省略" }
        label: { type: string, maxLength: 64, description: "如“护照”“近 6 个月工资条”" }
        filter: { type: object, additionalProperties: true, description: "找文档的条件，筛选条件 JSON（11.9）" }
        count: { type: integer, minimum: 1, maximum: 24, description: "要最新的几份，默认 1" }
        note: { type: string, maxLength: 1000, description: "备注，如“需要复印件”" }

    ChecklistInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, maxLength: 64 }
        note: { type: string, maxLength: 1000 }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ChecklistItem" } }

    Checklist:
      type: object
      required: [id, name, note, items, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        note: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/ChecklistItem" } }
        updatedAt: { type: string, format: date-time }

    ChecklistCheck:
      type: object
      required: [checklist, items]
      properties:
        checklist: { $ref: "#/components/schemas/Checklist" }
        items: { type: array, items: { $ref: "#/components/schemas/ChecklistCheckItem" } }

    ChecklistCheckItem:
      type: object
      required: [id, label, count, status, documents, expiredIds, attachedIds]
      properties:
        id: { type: string }
        label: { type: string }
        count: { type: integer }
        note: { type: string }
        status: { type: string, enum: [ok, partial, missing], description: "齐了、不够、没有" }
        documents: { type: array, items: { $ref: "#/components/schemas/DocumentSummary" }, description: "最新的几份" }
        expiredIds: { type: array, items: { type: integer, format: int64 }, description: "其中内置到期日早于今天的" }
        attachedIds: { type: array, items: { type: integer, format: int64 }, description: "其中手动放入的（v1.6.7），排在前面，可以移出" }

    UploadLinkInput:
      type: object
      required: [name, days, maxFiles]
      properties:
        name: { type: string, maxLength: 64, description: "如“请王师傅上传装修合同”，对方也能看到" }
        message: { type: string, maxLength: 500, description: "给对方的留言" }
        tagIds: { type: array, items: { type: integer, format: int64 } }
        drawerId: { type: integer, format: int64 }
        days: { type: integer, minimum: 1, maximum: 90 }
        maxFiles: { type: integer, minimum: 1, maximum: 200 }

    UploadLink:
      type: object
      required: [id, token, name, message, tagIds, maxFiles, fileCount, expiresAt, createdAt, creatorName, revoked, open]
      properties:
        id: { type: integer, format: int64 }
        token: { type: string, description: "链接为 /u/<token>" }
        name: { type: string }
        message: { type: string }
        tagIds: { type: array, items: { type: integer, format: int64 } }
        drawerId: { type: integer, format: int64 }
        maxFiles: { type: integer }
        fileCount: { type: integer, description: "已经收到的文件数" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        creatorName: { type: string }
        revoked: { type: boolean }
        open: { type: boolean, description: "还能收文件：没作废、没过期、没收满" }
        lastUploadAt: { type: string, format: date-time }

    PublicUploadLink:
      type: object
      required: [name, message, workspace, expiresAt, remaining]
      properties:
        name: { type: string }
        message: { type: string }
        workspace: { type: string, description: "文件会进入的空间的名称" }
        expiresAt: { type: string, format: date-time }
        remaining: { type: integer, description: "还能上传几个文件" }

    PublicBundle:
      type: object
      required: [title, expiresAt, documents, allowDownload, watermarked]
      properties:
        allowDownload: { type: boolean, description: "能下载（v1.9.2）；false 时只能在线查看，打包和单份下载都返回 403" }
        watermarked: { type: boolean, description: "PDF 上加了水印（v1.9.2）" }
        title: { type: string }
        expiresAt: { type: string, format: date-time }
        summary: { $ref: "#/components/schemas/HealthReport" }
        documents:
          type: array
          items:
            type: object
            required: [id, title, date, filename, mimeType, pageCount, size]
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              date: { type: string, format: date }
              filename: { type: string }
              mimeType: { type: string }
              pageCount: { type: integer }
              size: { type: integer, format: int64 }

    PublicShare:
      type: object
      required: [title, filename, mimeType, pageCount, size, expiresAt, allowDownload, watermarked]
      properties:
        allowDownload: { type: boolean, description: "能下载（v1.9.2）；false 时 download=true 返回 403" }
        watermarked: { type: boolean, description: "加了水印（v1.9.2）" }
        title: { type: string }
        filename: { type: string, description: "下载时的文件名" }
        mimeType: { type: string, description: "分享的文件的类型" }
        pageCount: { type: integer }
        size: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }

    AgentSettings:
      type: object
      required: [enabled, intake, steward, narrative, library, auto, dailyLimit, cloudAcknowledged, usedToday, model, embedding]
      properties:
        enabled: { type: boolean }
        intake: { type: boolean, description: "识别员" }
        steward: { type: boolean, description: "抽屉管家：提醒说明与要点建议（v0.5）" }
        narrative: { type: boolean, description: "年度回顾叙述（v0.5）" }
        library: { type: boolean, description: "书房助手：补全书目、摘要、复习卡片（v0.5）" }
        auto: { $ref: "#/components/schemas/AgentAuto" }
        dailyLimit: { type: integer, description: "每天最多调用模型的次数" }
        cloudAcknowledged: { type: boolean }
        privateCloud: { type: boolean, description: "家人的私密文档（健康数据）可以交给云端模型（v1.8.1，默认关）；还要这位家人本人同意。本地模型不受限" }
        vision: { type: boolean, description: "用看图模型读文字里没有结果的化验单照片（v1.9.0，默认关）" }
        visionModel: { type: string, description: "服务器配置的看图模型（KEPT_AI_VISION_MODEL）；没有时省略" }
        usedToday: { type: integer }
        model:
          type: object
          required: [configured, local]
          properties:
            configured: { type: boolean }
            host: { type: string }
            model: { type: string }
            local: { type: boolean, description: "模型在本机或内网" }
        embedding:
          type: object
          description: 向量索引（v0.5）：嵌入模型与这个空间的进度
          required: [configured, done, total]
          properties:
            configured: { type: boolean, description: "部署时配置了嵌入模型（KEPT_AI_EMBED_MODEL）" }
            model: { type: string }
            done: { type: integer, description: "已经生成向量的文档数" }
            total: { type: integer, description: "空间里的文档数（不含回收站）" }

    AgentAuto:
      type: object
      description: 自动执行（v0.5，设计文档 10.4）：把握 ≥ 80% 的建议直接生效；默认全部关闭。合并往来方、标签永远要人确认
      required: [organize, steward, library]
      properties:
        organize: { type: boolean, description: "整理助手对文档的修改（字段、标签、抽屉；可以撤销）" }
        steward: { type: boolean, description: "抽屉管家添加要点" }
        library: { type: boolean, description: "书房助手补全空着的书目" }

    SimilarDocuments:
      type: object
      required: [available, items]
      properties:
        available: { type: boolean, description: "这个空间有向量可用（配置了嵌入模型并开启了 AI）" }
        items:
          type: array
          items: { $ref: "#/components/schemas/SimilarDocument" }

    SimilarDocument:
      type: object
      required: [id, title, createdDate, score, snippet]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        createdDate: { type: string, format: date }
        score: { type: number, format: double, description: "相似度，0–1" }
        snippet: { type: string, description: "最接近的一段文字（截短）" }

    AgentRun:
      type: object
      required: [id, agent, trigger, model, status, calls, inputTokens, outputTokens, durationMs, summary, createdAt]
      properties:
        id: { type: integer, format: int64 }
        agent: { type: string }
        trigger: { type: string }
        documentId: { type: integer, format: int64 }
        documentTitle: { type: string }
        model: { type: string }
        status: { type: string, enum: [running, done, failed, skipped] }
        calls: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        durationMs: { type: integer, format: int64 }
        summary: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }

    Proposal:
      type: object
      required: [id, agent, kind, documentId, change, confidence, reason, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        agent: { type: string }
        kind: { type: string, enum: [set_fields, add_tags, set_drawer, split_document, set_rule, merge, add_fact, book_metadata] }
        documentId: { type: integer, format: int64, description: "整理建议（set_rule、merge）没有文档，为 0" }
        change:
          type: object
          description: 修改前后的值；split 为在哪些页之后拆开，titles 为各份的标题
          properties:
            fields: { type: object, additionalProperties: true }
            basis: { type: object, additionalProperties: { type: string }, description: "整理助手：各字段的依据" }
            tagIds: { type: array, items: { type: integer, format: int64 } }
            drawer: { type: array, items: { type: integer, format: int64 } }
            split: { type: array, items: { type: integer } }
            titles: { type: array, items: { type: string } }
            book:
              type: object
              description: 书房助手补全的书目：字段 → [改前, 改后]（authors、publisher、published、isbn、pages、language、series、description）
              additionalProperties: { type: array, items: {} }
        confidence: { type: number }
        reason: { type: string }
        status: { type: string, enum: [applied, pending, accepted, rejected, reverted, expired] }
        createdAt: { type: string, format: date-time }

    FactSuggestion:
      type: object
      required: [id, kind, label, text, reason, createdAt]
      properties:
        id: { type: integer, format: int64, description: "建议（Proposal）的 ID" }
        kind: { type: string, enum: [due, expect], description: "要添加的要点种类" }
        label: { type: string, description: "要点名称" }
        text: { type: string, description: "一句话说明要加什么" }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    OrganizeSuggestion:
      type: object
      required: [id, kind, target, name, count, reason, confidence, createdAt]
      properties:
        id: { type: integer, format: int64, description: "建议（Proposal）的 ID，用 /proposals/{id}/accept、reject 处理" }
        kind: { type: string, enum: [set_rule, merge] }
        target: { type: string, enum: [correspondent, type, tag] }
        targetId: { type: integer, format: int64, description: "规则建议：哪一项；合并：保留的那一项" }
        name: { type: string, description: "规则建议的那一项，或合并时保留的那一项" }
        count: { type: integer, description: "它的文档数" }
        match: { type: string, description: "规则建议：包含任一的关键词" }
        hits: { type: integer }
        total: { type: integer }
        others: { type: integer, description: "其他文档里含有关键词的份数（会被误中）" }
        merged:
          type: array
          description: 合并：要并入的项
          items:
            type: object
            required: [id, name, count]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              count: { type: integer }
        reason: { type: string }
        confidence: { type: number, format: double }
        createdAt: { type: string, format: date-time }

    NotificationPrefs:
      type: object
      required: [emailAlerts, smtp]
      properties:
        emailAlerts: { type: boolean, description: "每天早上把当前空间新出现的提醒发到个人资料中的邮箱" }
        email: { type: string, description: "个人资料中的邮箱；没有时省略，邮件提醒不会发出" }
        smtp: { type: boolean, description: "实例是否已配置发信" }

    EmailDocumentsRequest:
      type: object
      required: [ids, to]
      properties:
        ids: { type: array, minItems: 1, maxItems: 50, items: { type: integer, format: int64 } }
        to: { type: array, minItems: 1, maxItems: 10, items: { type: string }, description: "收件人邮箱" }
        subject: { type: string, description: "为空时用第一份文档的标题" }
        message: { type: string, description: "附言" }
        file: { type: string, enum: [archive, original], default: archive, description: "可搜索版（没有时用原件）或原件" }

    UpdateMeRequest:
      type: object
      required: [displayName, email]
      properties:
        displayName: { type: string }
        email: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }

    TwoFactorStatus:
      type: object
      required: [enabled, recoveryCodesLeft]
      properties:
        enabled: { type: boolean }
        recoveryCodesLeft: { type: integer, description: 剩余未使用的恢复码数量；未开启时为 0 }

    TwoFactorSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: 大写 base32 密钥，供无法扫码时手动输入 }
        otpauthUri: { type: string, description: "otpauth:// 链接，用于生成二维码" }

    EnableTwoFactorRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 认证器 App 生成的 6 位验证码 }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
          description: 恢复码明文，只返回这一次

    ConfirmPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, description: 当前密码，用于确认这个操作 }

    MailAccount:
      type: object
      required: [id, name, host, port, security, username, hasPassword, folder, filterFrom, filterSubject, tagIds, afterAction, moveTo, bodyMode, attachInclude, attachExclude, correspondentFromSender, filterTo, filterBody, maxAgeDays, titleFrom, enabled, lastError, lastCount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [tls, starttls, none] }
        username: { type: string }
        hasPassword: { type: boolean }
        folder: { type: string }
        filterFrom: { type: string, description: "发件人包含（空：不限）" }
        filterSubject: { type: string, description: "主题包含（空：不限）" }
        documentTypeId: { type: integer, format: int64 }
        correspondentId: { type: integer, format: int64 }
        tagIds: { type: array, items: { type: integer, format: int64 } }
        afterAction: { type: string, enum: [read, move] }
        bodyMode: { type: string, enum: [none, no_attachments, always], description: "邮件正文（v1.4.0）：不保存 / 没有附件时保存 / 总是保存，存成 PDF" }
        attachInclude: { type: string, description: "附件名包含这些词之一才收（空格或逗号分开；空表示都收，v1.5.1）" }
        attachExclude: { type: string, description: "附件名包含这些词之一就不收" }
        correspondentFromSender: { type: boolean, description: "没有预设往来方时，按发件人名称对应往来方，没有就新建" }
        filterTo: { type: string, description: "收件人（含抄送）包含（空：不限，v1.5.7）" }
        filterBody: { type: string, description: "正文包含（空：不限，v1.5.7）" }
        maxAgeDays: { type: integer, description: "只收最近这么多天的邮件（0：不限，v1.5.7）" }
        titleFrom: { type: string, enum: [filename, subject], description: "附件文档的标题取自文件名或邮件主题（v1.5.7）" }
        moveTo: { type: string }
        enabled: { type: boolean }
        checkedAt: { type: string, format: date-time }
        lastError: { type: string }
        lastCount: { type: integer, description: "最近一次收到的附件数" }

    MailAccountInput:
      type: object
      required: [host, username]
      properties:
        name: { type: string, maxLength: 64 }
        host: { type: string }
        port: { type: integer, description: "0：按加密方式用 993 或 143" }
        security: { type: string, enum: [tls, starttls, none] }
        username: { type: string }
        password: { type: string, description: "新建时必填；修改时留空表示不变" }
        folder: { type: string }
        filterFrom: { type: string }
        filterSubject: { type: string }
        documentTypeId: { type: integer, format: int64 }
        correspondentId: { type: integer, format: int64 }
        tagIds: { type: array, items: { type: integer, format: int64 } }
        afterAction: { type: string, enum: [read, move] }
        bodyMode: { type: string, enum: [none, no_attachments, always], description: "省略时：新建为 no_attachments，修改时不变" }
        attachInclude: { type: string, maxLength: 200 }
        attachExclude: { type: string, maxLength: 200 }
        correspondentFromSender: { type: boolean }
        filterTo: { type: string, maxLength: 200 }
        filterBody: { type: string, maxLength: 200 }
        maxAgeDays: { type: integer, minimum: 0, maximum: 3650 }
        titleFrom: { type: string, enum: [filename, subject], description: "省略时：新建为 filename，修改时不变" }
        moveTo: { type: string }
        enabled: { type: boolean }

    MailMessage:
      type: object
      description: 收件邮箱处理过的一封邮件（v1.5.7）
      required: [uidValidity, uid, seenAt, sender, subject, status, reason, taken, action]
      properties:
        uidValidity: { type: integer, format: int64 }
        uid: { type: integer, format: int64 }
        seenAt: { type: string, format: date-time, description: "处理的时间" }
        sentAt: { type: string, format: date-time, description: "邮件的发送时间" }
        sender: { type: string }
        subject: { type: string }
        status: { type: string, enum: [taken, skipped], description: "taken 收进来了（taken 份）；skipped 不符合规则，没有动它" }
        reason: { type: string, description: "跳过或没有收到文档的原因" }
        taken: { type: integer, description: "收进待整理的文档数" }
        action: { type: string, enum: ["", read, move], description: "对邮件做了什么：标为已读、移到文件夹，或没有动" }

    PageEdits:
      type: object
      description: 页面编辑的状态；页码按编辑之前的 PDF 计
      properties:
        rotate:
          type: object
          description: 页码 → 顺时针旋转的角度（90、180、270）
          additionalProperties: { type: integer }
        delete: { type: array, items: { type: integer } }
        order:
          type: array
          description: 编辑之前的全部页码按显示顺序排列（v1.3.9）；省略表示原来的顺序
          items: { type: integer }

    Device:
      type: object
      required: [id, name, workspaceId, workspaceName, pairedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        workspaceId: { type: integer, format: int64 }
        workspaceName: { type: string }
        pairedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        access: { $ref: "#/components/schemas/DeviceAccess" }

    DeviceAccess:
      type: string
      enum: [upload, full]
      description: "upload：只能上传（App 1.x）；full：按账号在空间里的角色访问（App 2.0）"

    PairingCode:
      type: object
      required: [code, expiresAt, workspaceName, urls, qr]
      properties:
        code: { type: string, description: "8 位数字" }
        expiresAt: { type: string, format: date-time }
        workspaceName: { type: string }
        urls: { type: array, items: { type: string }, description: "二维码中的服务器地址，按顺序尝试" }
        qr: { type: string, description: "二维码内容（JSON 文本，设计文档 9.3）" }

    PairedDevice:
      type: object
      required: [token, deviceId, workspace, userName, maxUploadSize, access]
      properties:
        token: { type: string, description: "设备 token，放在 Authorization: Bearer 中" }
        deviceId: { type: integer, format: int64 }
        workspace: { $ref: "#/components/schemas/WorkspaceRef" }
        userName: { type: string }
        maxUploadSize: { type: integer, format: int64 }
        access: { $ref: "#/components/schemas/DeviceAccess" }

    WorkspaceRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    MobileBootstrap:
      type: object
      required: [workspace, userName, drawers, tags, documentTypes, maxUploadSize, acceptedTypes, access, role, ai]
      properties:
        workspace: { $ref: "#/components/schemas/WorkspaceRef" }
        userName: { type: string }
        access: { $ref: "#/components/schemas/DeviceAccess" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        ai: { type: boolean, description: "这个空间可以用问答（配置了模型且空间开启了 AI）" }
        drawers:
          type: array
          items:
            type: object
            required: [id, name, icon, color]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              icon: { type: string }
              color: { type: string }
        tags:
          type: array
          items:
            type: object
            required: [id, name, color]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              path: { type: string, description: "带上级的名称，如“财务 / 发票”" }
              color: { type: string }
        documentTypes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        maxUploadSize: { type: integer, format: int64 }
        acceptedTypes: { type: array, items: { type: string }, description: "可以上传的 MIME 类型" }
        edition: { type: string, enum: [free, pro, team], description: "当前版本（v1.12）；旧服务器没有，按收费版看待" }
        features:
          type: array
          description: 当前版本在免费版之外包含的功能（v1.12），同 EditionStatus.features
          items: { type: string }

    UploadStatus:
      type: object
      required: [clientUploadId, status]
      properties:
        clientUploadId: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, unknown], description: "unknown：服务器上没有这个 ID" }
        documentId: { type: integer, format: int64 }
        error: { type: string }

    ApiToken:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: Token 的前几位，用于辨认 }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    CreatedApiToken:
      type: object
      required: [token, apiToken]
      properties:
        token: { type: string, description: 明文 Token，只返回这一次 }
        apiToken: { $ref: "#/components/schemas/ApiToken" }

    AdminCreateUserRequest:
      type: object
      required: [email, password]
      properties:
        username: { type: string, description: "留空时根据邮箱自动生成" }
        password: { type: string }
        displayName: { type: string }
        email: { type: string }
        isAdmin: { type: boolean }

    AdminUpdateUserRequest:
      type: object
      properties:
        disabled: { type: boolean }
        isAdmin: { type: boolean }

    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读的错误码，例如 not_found、invalid_request、unauthorized、csrf_failed
        message:
          type: string
          description: 面向用户的中文说明
        details:
          type: object
          additionalProperties: true
          description: >-
            登录失败时含 remainingAttempts（剩余尝试次数）；
            被锁定时含 retryAfterSeconds（还需等待的秒数）
